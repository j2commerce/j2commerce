PLG_SYSTEM_J2COMMERCE_FIELDSET_OFFERS_LABEL="Configurações de Oferta"
PLG_SYSTEM_J2COMMERCE_FIELD_ITEM_CONDITION_LABEL="Condição do Item"
PLG_SYSTEM_J2COMMERCE_FIELD_ITEM_CONDITION_DESC="Condição padrão para todos os produtos. Este valor é usado para conformidade com os Resultados Pesquisados do Google."
PLG_SYSTEM_J2COMMERCE_OPTION_NEW_CONDITION="Novo"
PLG_SYSTEM_J2COMMERCE_OPTION_USED_CONDITION="Usado"
PLG_SYSTEM_J2COMMERCE_OPTION_REFURBISHED_CONDITION="Recondicionado"
PLG_SYSTEM_J2COMMERCE_OPTION_DAMAGED_CONDITION="Com Avaria"

PLG_SYSTEM_J2COMMERCE_FIELD_PRICE_VALID_UNTIL_LABEL="Preço Valid Until"
PLG_SYSTEM_J2COMMERCE_FIELD_PRICE_VALID_UNTIL_DESC="Quanto tempo o preço deve ser válido. Necessário para conformidade com o Google Merchant."
PLG_SYSTEM_J2COMMERCE_OPTION_1_MONTH="1 Mês"
PLG_SYSTEM_J2COMMERCE_OPTION_3_MONTHS="3 Meses"
PLG_SYSTEM_J2COMMERCE_OPTION_6_MONTHS="6 Meses"
PLG_SYSTEM_J2COMMERCE_OPTION_1_YEAR="1 Ano (Recomendado)"
PLG_SYSTEM_J2COMMERCE_OPTION_CUSTOM="Data Personalizada"

PLG_SYSTEM_J2COMMERCE_FIELD_PRICE_VALID_CUSTOM_DATE_LABEL="Data de Validade Personalizada"
PLG_SYSTEM_J2COMMERCE_FIELD_PRICE_VALID_CUSTOM_DATE_DESC="Selecione uma data personalizada para validade do preço. Só é usado quando 'Dados Personalizados' é selecionado acima."

; Leaflet Map Fieldset
PLG_SYSTEM_J2COMMERCE_LEAFLET_SHOW_ORDER_CONFIRM="Exibir Map on Confirmação do Pedido"
PLG_SYSTEM_J2COMMERCE_LEAFLET_MAP_HEIGHT="Altura do Mapa (px)"
PLG_SYSTEM_J2COMMERCE_LEAFLET_MAP_HEIGHT_DESC="Altura em pixels do container do mapa. Padrão: 250."
PLG_SYSTEM_J2COMMERCE_LEAFLET_MAP_ZOOM="Nível de Zoom Padrão"
PLG_SYSTEM_J2COMMERCE_LEAFLET_MAP_ZOOM_DESC="Nível de zoom para o mapa. 1 = mundo, 19 = nível do edifício. Padrão: 15."
PLG_SYSTEM_J2COMMERCE_LEAFLET_TILE_PROVIDER="Provedor de Tiles"
PLG_SYSTEM_J2COMMERCE_LEAFLET_TILE_PROVIDER_DESC="Selecione o provedor de tile do mapa."
PLG_SYSTEM_J2COMMERCE_LEAFLET_NOMINATIM_EMAIL="E-mail de Contato Nominatim"
PLG_SYSTEM_J2COMMERCE_LEAFLET_NOMINATIM_EMAIL_DESC="Endereço de email enviado à API de geocodificação Nominatim de acordo com sua política de uso. Retorna para o email de administrador do J2Commerce se deixado vazio."
PLG_SYSTEM_J2COMMERCE_FIELDSET_RETURNS_LABEL="Política de Devolução"
PLG_SYSTEM_J2COMMERCE_FIELDSET_SHIPPING_LABEL="Detalhes de envio"
PLG_SYSTEM_J2COMMERCE_FIELD_RETURN_POLICY_ENABLED_LABEL="Publicar a Política de Devoluções"
PLG_SYSTEM_J2COMMERCE_FIELD_RETURN_POLICY_ENABLED_DESC="Adicione sua política de devolução aos dados estruturados do produto. Ative essa opção somente quando os valores abaixo corresponderem à política que o senhor realmente oferece."
PLG_SYSTEM_J2COMMERCE_FIELD_RETURN_COUNTRY_LABEL="País de devolução"
PLG_SYSTEM_J2COMMERCE_FIELD_RETURN_COUNTRY_DESC="Código de país de duas letras da norma ISO 3166-1 onde são aceitas devoluções, por exemplo, US."
PLG_SYSTEM_J2COMMERCE_FIELD_RETURN_DAYS_LABEL="Prazo para devolução (dias)"
PLG_SYSTEM_J2COMMERCE_FIELD_RETURN_DAYS_DESC="Número de dias que um cliente tem para devolver um produto."
PLG_SYSTEM_J2COMMERCE_FIELD_RETURN_FEES_LABEL="Taxas de devolução"
PLG_SYSTEM_J2COMMERCE_FIELD_RETURN_FEES_DESC="Quem arca com os custos da devolução de um produto."
PLG_SYSTEM_J2COMMERCE_OPTION_FREE_RETURN="Devolução gratuita"
PLG_SYSTEM_J2COMMERCE_OPTION_RETURN_SHIPPING_FEES="A loja arca com os custos de frete de devolução"
PLG_SYSTEM_J2COMMERCE_OPTION_RETURN_FEES_CUSTOMER="O cliente paga o frete de devolução"
PLG_SYSTEM_J2COMMERCE_FIELD_SHIPPING_DETAILS_ENABLED_LABEL="Publicar detalhes de envio"
PLG_SYSTEM_J2COMMERCE_FIELD_SHIPPING_DETAILS_ENABLED_DESC="Adicione uma taxa de envio anunciada e uma estimativa de entrega aos dados estruturados do produto. Ative essa opção somente quando os valores abaixo corresponderem ao que o senhor realmente cobra."
PLG_SYSTEM_J2COMMERCE_FIELD_SHIP_COUNTRY_LABEL="País de destino da remessa"
PLG_SYSTEM_J2COMMERCE_FIELD_SHIP_COUNTRY_DESC="Código de país de duas letras da norma ISO 3166-1 ao qual esta tarifa se aplica, por exemplo, US."
PLG_SYSTEM_J2COMMERCE_FIELD_SHIP_RATE_LABEL="Taxa de envio anunciada"
PLG_SYSTEM_J2COMMERCE_FIELD_SHIP_RATE_DESC="Custo de envio a ser exibido nos resultados de pesquisa. Utilize 0 para frete grátis."
PLG_SYSTEM_J2COMMERCE_FIELD_SHIP_HANDLING_DAYS_LABEL="Prazo máximo de processamento"
PLG_SYSTEM_J2COMMERCE_FIELD_SHIP_HANDLING_DAYS_DESC="O maior intervalo de tempo entre o momento em que um pedido é feito e o momento em que ele sai do seu depósito."
PLG_SYSTEM_J2COMMERCE_FIELD_SHIP_TRANSIT_DAYS_LABEL="Dias máximos de trânsito"
PLG_SYSTEM_J2COMMERCE_FIELD_SHIP_TRANSIT_DAYS_DESC="Tempo máximo de trânsito após o envio de um pedido."
