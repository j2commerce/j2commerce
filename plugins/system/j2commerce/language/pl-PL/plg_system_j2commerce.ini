PLG_SYSTEM_J2COMMERCE_FIELD_PRICE_VALID_CUSTOM_DATE_DESC="Proszę wybrać niestandardową datę ważności ceny. Używane tylko wtedy, gdy powyżej wybrano opcję 'Data niestandardowa'."

; Leaflet Map Fieldset
PLG_SYSTEM_J2COMMERCE_LEAFLET_SHOW_ORDER_CONFIRM="Pokaż mapę w potwierdzeniu zamówienia"
PLG_SYSTEM_J2COMMERCE_LEAFLET_MAP_HEIGHT="Wysokość mapy (px)"
PLG_SYSTEM_J2COMMERCE_LEAFLET_MAP_HEIGHT_DESC="Wysokość kontenera mapy w pikselach. Domyślnie: 250."
PLG_SYSTEM_J2COMMERCE_LEAFLET_MAP_ZOOM="Domyślny poziom powiększenia"
PLG_SYSTEM_J2COMMERCE_LEAFLET_MAP_ZOOM_DESC="Poziom powiększenia mapy. 1 = świat, 19 = poziom budynku. Domyślnie: 15."
PLG_SYSTEM_J2COMMERCE_LEAFLET_TILE_PROVIDER="Dostawca kafelków"
PLG_SYSTEM_J2COMMERCE_LEAFLET_TILE_PROVIDER_DESC="Proszę wybrać dostawcę kafelków mapy."
PLG_SYSTEM_J2COMMERCE_LEAFLET_NOMINATIM_EMAIL="Email kontaktowy Nominatim"
PLG_SYSTEM_J2COMMERCE_LEAFLET_NOMINATIM_EMAIL_DESC="Adres e-mail wysyłany do interfejsu API geokodowania Nominatim zgodnie z ich polityką użytkowania. Powraca do adresu e-mail administratora J2Commerce, jeśli pozostanie pusty."
PLG_SYSTEM_J2COMMERCE_FIELDSET_RETURNS_LABEL="Zasady zwrotów"
PLG_SYSTEM_J2COMMERCE_FIELDSET_SHIPPING_LABEL="Szczegóły wysyłki"
PLG_SYSTEM_J2COMMERCE_FIELD_RETURN_POLICY_ENABLED_LABEL="Opublikuj zasady zwrotów"
PLG_SYSTEM_J2COMMERCE_FIELD_RETURN_POLICY_ENABLED_DESC="Proszę dodać zasady zwrotów do danych strukturalnych produktu. Opcję tę należy włączyć dopiero wtedy, gdy poniższe wartości są zgodne z zasadami, które faktycznie Państwo stosują."
PLG_SYSTEM_J2COMMERCE_FIELD_RETURN_COUNTRY_LABEL="Kraj zwrotu"
PLG_SYSTEM_J2COMMERCE_FIELD_RETURN_COUNTRY_DESC="Dwuliterowy kod kraju zgodny z normą ISO 3166-1, w którym akceptowane są zwroty, na przykład US."
PLG_SYSTEM_J2COMMERCE_FIELD_RETURN_DAYS_LABEL="Okres zwrotu (w dniach)"
PLG_SYSTEM_J2COMMERCE_FIELD_RETURN_DAYS_DESC="Liczba dni, w ciągu których klient ma prawo zwrócić produkt."
PLG_SYSTEM_J2COMMERCE_FIELD_RETURN_FEES_LABEL="Opłaty za zwrot"
PLG_SYSTEM_J2COMMERCE_FIELD_RETURN_FEES_DESC="Kto pokrywa koszty zwrotu produktu."
PLG_SYSTEM_J2COMMERCE_OPTION_FREE_RETURN="Bezpłatny zwrot"
PLG_SYSTEM_J2COMMERCE_OPTION_RETURN_SHIPPING_FEES="Sklep pokrywa koszty wysyłki zwrotnej"
PLG_SYSTEM_J2COMMERCE_OPTION_RETURN_FEES_CUSTOMER="Klient pokrywa koszty wysyłki zwrotnej"
PLG_SYSTEM_J2COMMERCE_FIELD_SHIPPING_DETAILS_ENABLED_LABEL="Opublikuj szczegóły wysyłki"
PLG_SYSTEM_J2COMMERCE_FIELD_SHIPPING_DETAILS_ENABLED_DESC="Proszę dodać reklamowaną stawkę za wysyłkę oraz szacowany czas dostawy do danych strukturalnych produktu. Proszę włączyć tę opcję dopiero wtedy, gdy poniższe wartości będą odpowiadały faktycznie pobieranym opłatom."
PLG_SYSTEM_J2COMMERCE_FIELD_SHIP_COUNTRY_LABEL="Kraj dostawy"
PLG_SYSTEM_J2COMMERCE_FIELD_SHIP_COUNTRY_DESC="Dwuliterowy kod kraju zgodny z normą ISO 3166-1, do którego odnosi się ta stawka, na przykład US."
PLG_SYSTEM_J2COMMERCE_FIELD_SHIP_RATE_LABEL="Podana stawka za wysyłkę"
PLG_SYSTEM_J2COMMERCE_FIELD_SHIP_RATE_DESC="Koszt wysyłki do wyświetlenia w wynikach wyszukiwania. W przypadku bezpłatnej wysyłki należy wpisać 0."
PLG_SYSTEM_J2COMMERCE_FIELD_SHIP_HANDLING_DAYS_LABEL="Maksymalna liczba dni na realizację zamówienia"
PLG_SYSTEM_J2COMMERCE_FIELD_SHIP_HANDLING_DAYS_DESC="Najdłuższy czas od złożenia zamówienia do opuszczenia magazynu przez przesyłkę."
PLG_SYSTEM_J2COMMERCE_FIELD_SHIP_TRANSIT_DAYS_LABEL="Maksymalna liczba dni transportu"
PLG_SYSTEM_J2COMMERCE_FIELD_SHIP_TRANSIT_DAYS_DESC="Najdłuższy czas transportu od momentu wysłania zamówienia."
