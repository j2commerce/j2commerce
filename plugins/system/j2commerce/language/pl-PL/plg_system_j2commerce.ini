PLG_SYSTEM_J2COMMERCE_FIELD_DEBUG_MODE_DESC="Proszę włączyć dodawanie komentarzy HTML pokazujących informacje debugowania wstrzyknięcia schematu."
PLG_SYSTEM_J2COMMERCE_FIELD_DEFAULT_BRAND_LABEL="Domyślna marka"
PLG_SYSTEM_J2COMMERCE_FIELD_DEFAULT_BRAND_DESC="Domyślna nazwa marki używana, gdy produkty nie mają przypisanego producenta."

