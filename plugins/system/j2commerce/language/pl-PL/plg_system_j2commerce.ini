PLG_SYSTEM_J2COMMERCE="System - J2Commerce"
PLG_SYSTEM_J2COMMERCE_DESCRIPTION="Wtyczka systemowa zapewniająca podstawową funkcjonalność J2Commerce, w tym zarządzanie sesją koszyka, inicjalizację JavaScript, wstrzykiwanie klas wersji i zadania cron kontroli zapasów w tle."

; Fieldsets
PLG_SYSTEM_J2COMMERCE_FIELDSET_BASIC="Opcje podstawowe"
PLG_SYSTEM_J2COMMERCE_FIELDSET_LEAFLETMAP="Mapa Leaflet"
PLG_SYSTEM_J2COMMERCE_FIELDSET_SCHEMA_LABEL="Schemat"
PLG_SYSTEM_J2COMMERCE_FIELDSET_SETTINGS_LABEL="Ustawienia"

; Fields
PLG_SYSTEM_J2COMMERCE_FIELD_ENABLE_VERSION_CLASS="Włącz klasę wersji"
PLG_SYSTEM_J2COMMERCE_FIELD_ENABLE_VERSION_CLASS_DESC="Proszę dodać klasę wersji J2Commerce do znacznika body na frontendowych stronach J2Commerce. Pozwala to na ukierunkowanie CSS na konkretną wersję."

PLG_SYSTEM_J2COMMERCE_FIELD_ENABLE_CART_CACHE_CLEAR="Wyczyść pamięć podręczną przy aktualizacji koszyka"
PLG_SYSTEM_J2COMMERCE_FIELD_ENABLE_CART_CACHE_CLEAR_DESC="Automatycznie czyści pamięć podręczną strony, gdy koszyk zostanie zmodyfikowany. Dzięki temu użytkownicy zawsze widzą aktualne dane koszyka."

PLG_SYSTEM_J2COMMERCE_FIELD_ENABLE_CRON="Włącz Cron inwentaryzacji"
PLG_SYSTEM_J2COMMERCE_FIELD_ENABLE_CRON_DESC="Uruchamia codzienne zadanie kontroli zapasów, aby anulować nieopłacone zamówienia po terminie i przywrócić zapasy. Uruchamia się automatycznie przy ładowaniu strony, gdy miną 24 godziny od ostatniego uruchomienia."

; Messages
PLG_SYSTEM_J2COMMERCE_MSG_CRON_EXECUTED="Wykonano zadanie cron kontroli zapasów."
PLG_SYSTEM_J2COMMERCE_MSG_CART_MIGRATED="Koszyk został zmigrowany dla zalogowanego użytkownika."
PLG_SYSTEM_J2COMMERCE_MSG_CACHE_CLEARED="Pamięć podręczna strony wyczyszczona po aktualizacji koszyka."

