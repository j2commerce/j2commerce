PLG_SYSTEM_J2COMMERCE_OPTION_CUSTOM="Προσαρμοσμένη ημερομηνία"

PLG_SYSTEM_J2COMMERCE_FIELD_PRICE_VALID_CUSTOM_DATE_LABEL="Προσαρμοσμένη ημερομηνία ισχύος μέχρι"
PLG_SYSTEM_J2COMMERCE_FIELD_PRICE_VALID_CUSTOM_DATE_DESC="Επιλέξτε μια προσαρμοσμένη ημερομηνία για την εγκυρότητα της τιμής. Χρησιμοποιείται μόνο όταν έχει επιλεγεί η 'Προσαρμοσμένη ημερομηνία' παραπάνω."

; Leaflet Map Fieldset
PLG_SYSTEM_J2COMMERCE_LEAFLET_SHOW_ORDER_CONFIRM="Εμφάνιση χάρτη στην επιβεβαίωση παραγγελίας"
PLG_SYSTEM_J2COMMERCE_LEAFLET_MAP_HEIGHT="Ύψος χάρτη (px)"
PLG_SYSTEM_J2COMMERCE_LEAFLET_MAP_HEIGHT_DESC="Ύψος σε εικονοστοιχεία για το δοχείο χάρτη. Προεπιλογή: 250."
PLG_SYSTEM_J2COMMERCE_LEAFLET_MAP_ZOOM="Προεπιλεγμένο επίπεδο ζουμ"
PLG_SYSTEM_J2COMMERCE_LEAFLET_MAP_ZOOM_DESC="Επίπεδο ζουμ για το χάρτη. 1 = παγκόσμιο επίπεδο, 19 = επίπεδο κτιρίου. Προεπιλογή: 15."
PLG_SYSTEM_J2COMMERCE_LEAFLET_TILE_PROVIDER="Πάροχος πλακιδίων"
PLG_SYSTEM_J2COMMERCE_LEAFLET_TILE_PROVIDER_DESC="Επιλέξτε τον πάροχο πλακιδίων χάρτη."
PLG_SYSTEM_J2COMMERCE_LEAFLET_NOMINATIM_EMAIL="Email επικοινωνίας Nominatim"
PLG_SYSTEM_J2COMMERCE_LEAFLET_NOMINATIM_EMAIL_DESC="Διεύθυνση ηλεκτρονικού ταχυδρομείου που αποστέλλεται στο API γεωκωδικοποίησης της Nominatim σύμφωνα με την πολιτική χρήσης τους. Επιστρέφει στο email του διαχειριστή του J2Commerce, αν παραμείνει κενό."
PLG_SYSTEM_J2COMMERCE_FIELDSET_RETURNS_LABEL="Πολιτική επιστροφών"
PLG_SYSTEM_J2COMMERCE_FIELDSET_SHIPPING_LABEL="Στοιχεία αποστολής"
PLG_SYSTEM_J2COMMERCE_FIELD_RETURN_POLICY_ENABLED_LABEL="Δημοσίευση Πολιτικής Επιστροφών"
PLG_SYSTEM_J2COMMERCE_FIELD_RETURN_POLICY_ENABLED_DESC="Προσθέστε την πολιτική επιστροφών σας στα δομημένα δεδομένα προϊόντων. Ενεργοποιήστε αυτή τη ρύθμιση μόνο όταν οι παρακάτω τιμές αντιστοιχούν στην πολιτική που προσφέρετε στην πράξη."
PLG_SYSTEM_J2COMMERCE_FIELD_RETURN_COUNTRY_LABEL="Χώρα επιστροφής"
PLG_SYSTEM_J2COMMERCE_FIELD_RETURN_COUNTRY_DESC="Διψήφιος κωδικός χώρας ISO 3166-1 όπου γίνονται δεκτές επιστροφές, για παράδειγμα US."
PLG_SYSTEM_J2COMMERCE_FIELD_RETURN_DAYS_LABEL="Περίοδος επιστροφής (ημέρες)"
PLG_SYSTEM_J2COMMERCE_FIELD_RETURN_DAYS_DESC="Αριθμός ημερών που έχει στη διάθεσή του ένας πελάτης για να επιστρέψει ένα προϊόν."
PLG_SYSTEM_J2COMMERCE_FIELD_RETURN_FEES_LABEL="Έξοδα επιστροφής"
PLG_SYSTEM_J2COMMERCE_FIELD_RETURN_FEES_DESC="Ποιος πληρώνει για την επιστροφή ενός προϊόντος."
PLG_SYSTEM_J2COMMERCE_OPTION_FREE_RETURN="Δωρεάν επιστροφή"
PLG_SYSTEM_J2COMMERCE_OPTION_RETURN_SHIPPING_FEES="Το κατάστημα αναλαμβάνει τα έξοδα αποστολής της επιστροφής"
PLG_SYSTEM_J2COMMERCE_OPTION_RETURN_FEES_CUSTOMER="Ο πελάτης πληρώνει τα έξοδα αποστολής επιστροφής"
PLG_SYSTEM_J2COMMERCE_FIELD_SHIPPING_DETAILS_ENABLED_LABEL="Δημοσίευση λεπτομερειών αποστολής"
PLG_SYSTEM_J2COMMERCE_FIELD_SHIPPING_DETAILS_ENABLED_DESC="Προσθέστε μια διαφημιζόμενη χρέωση αποστολής και μια εκτίμηση χρόνου παράδοσης στα δομημένα δεδομένα του προϊόντος. Ενεργοποιήστε αυτή τη ρύθμιση μόνο όταν οι παρακάτω τιμές αντιστοιχούν σε αυτές που χρεώνετε στην πραγματικότητα."
PLG_SYSTEM_J2COMMERCE_FIELD_SHIP_COUNTRY_LABEL="Χώρα προορισμού αποστολής"
PLG_SYSTEM_J2COMMERCE_FIELD_SHIP_COUNTRY_DESC="Διψήφιος κωδικός χώρας ISO 3166-1 στον οποίο ισχύει αυτή η τιμή, για παράδειγμα US."
PLG_SYSTEM_J2COMMERCE_FIELD_SHIP_RATE_LABEL="Δηλωμένη χρέωση αποστολής"
PLG_SYSTEM_J2COMMERCE_FIELD_SHIP_RATE_DESC="Κόστος αποστολής που θα εμφανίζεται στα αποτελέσματα αναζήτησης. Χρησιμοποιήστε το 0 για δωρεάν αποστολή."
PLG_SYSTEM_J2COMMERCE_FIELD_SHIP_HANDLING_DAYS_LABEL="Μέγιστος αριθμός ημερών επεξεργασίας"
PLG_SYSTEM_J2COMMERCE_FIELD_SHIP_HANDLING_DAYS_DESC="Ο μέγιστος χρόνος που μεσολαβεί από τη στιγμή που υποβάλλεται μια παραγγελία έως την αποστολή της από την αποθήκη σας."
PLG_SYSTEM_J2COMMERCE_FIELD_SHIP_TRANSIT_DAYS_LABEL="Μέγιστος αριθμός ημερών μεταφοράς"
PLG_SYSTEM_J2COMMERCE_FIELD_SHIP_TRANSIT_DAYS_DESC="Ο μέγιστος χρόνος μεταφοράς μετά την αποστολή μιας παραγγελίας."
