; Sandbox subscription test harness (admin-only, sandbox-mode-only)
PLG_J2COMMERCE_PAYMENT_PAYPAL_SANDBOX_TEST_LABEL="Testbenk for abonnementer i sandbox"
PLG_J2COMMERCE_PAYMENT_PAYPAL_SANDBOX_TEST_DESC="<strong>1. Test påloggingsopplysninger</strong> — verifiserer at sandboxens client_id og hemmelige nøkkel innhenter et gyldig OAuth-token.<br><strong>2. Opprett abonnement</strong> — oppretter et ekte katalogprodukt, en faktureringsplan ($1.00/day × 5 sykluser) og et abonnement i sandboxen din. Returnerer en godkjennings-URL — klikk på den, logg inn med en PERSONAL-konto i sandboxen, og godkjenn.<br><strong>3. Sjekk status</strong> — lim inn abonnements-ID-en I-XXXX og bekreft at remote_status har endret seg til ACTIVE etter godkjenning.<br><strong>4. Avbryt</strong> — fjern testabonnementet slik at det ikke fortsetter å belaste sandbox-kontoen."
PLG_J2COMMERCE_PAYMENT_PAYPAL_SANDBOX_TEST_CREDS="1. Test påloggingsopplysninger"
PLG_J2COMMERCE_PAYMENT_PAYPAL_SANDBOX_TEST_CREATE="2. Opprett testabonnement"
PLG_J2COMMERCE_PAYMENT_PAYPAL_SANDBOX_TEST_CHECK="3. Sjekk status"
PLG_J2COMMERCE_PAYMENT_PAYPAL_SANDBOX_TEST_CANCEL="4. Avbryt testabonnement"
PLG_J2COMMERCE_PAYMENT_PAYPAL_SANDBOX_TEST_NVP="5. Test NVP-påloggingsopplysninger"
PLG_J2COMMERCE_PAYMENT_PAYPAL_SANDBOX_TEST_SUBID_LABEL="PayPal-abonnements-ID"
PLG_J2COMMERCE_PAYMENT_PAYPAL_SANDBOX_TEST_SUBID_HELP="Fylles ut automatisk etter trinn 2. Brukes av «Sjekk status» / «Avbryt»."

