PLG_J2COMMERCE_PAYMENT_PAYPAL_PENDING_STATUS="Venter på registrering av ordrestatus"
PLG_J2COMMERCE_PAYMENT_PAYPAL_PENDING_STATUS_DESC="Bestillingsstatus som skrives når PayPal rapporterer en innbetaling som ventende. La feltet stå tomt for å bruke statusen som er tilordnet som «Åpen», eller kjernestatusen «Ventende»."
