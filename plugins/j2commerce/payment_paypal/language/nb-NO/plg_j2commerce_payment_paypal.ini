PLG_J2COMMERCE_PAYMENT_PAYPAL_REFUNDED_STATUS="Status for refundert ordre"
PLG_J2COMMERCE_PAYMENT_PAYPAL_REFUNDED_STATUS_DESC="Ordrestatus som skrives når en transaksjon refunderes, enten via administrasjonsknappen for refusjon eller en PayPal-webhook. La feltet stå tomt for å bruke statusen som er tilordnet som «Refundert»; hvis ingen status er tilordnet, forblir statusen uendret."
