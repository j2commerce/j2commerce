; Configuration - Subscription mode toggle
PLG_J2COMMERCE_PAYMENT_PAYPAL_SUBSCRIPTION_MODE_LABEL="Modus for opprettelse av abonnement"
PLG_J2COMMERCE_PAYMENT_PAYPAL_SUBSCRIPTION_MODE_DESC="<strong>Styrer hvordan NYE abonnementer opprettes ved kassen.</strong> Fornyelser går alltid via metakey, slik at abonnementer opprettet i begge modusene fortsetter å fungere når denne bryteren endres.<br><br><strong>Moderne REST</strong> (standard): kunden bruker Smart Buttons-popup → gjentakende betalingsplan på PayPal-siden → appen utfører tvangsbelastninger via /v1/billing/subscriptions/{id}/capture. Lagres som paypal_subscription_id metakey.<br><br><strong>Eldre NVP</strong> (J2Store-kompatibel): kunden omdirigeres til klassisk PayPal Express Checkout → BAID returneres → appens cron belaster via DoReferenceTransaction. Lagres som billing_agreement_id metakey. Bruk dette ved migrering fra J2Store med den hensikt at et migreringsverktøy senere skal konvertere eldre BAID-er til moderne paypal_subscription_id-verdier."
PLG_J2COMMERCE_PAYMENT_PAYPAL_SUBSCRIPTION_MODE_REST="Moderne REST-abonnements-API (Smart Buttons)"
PLG_J2COMMERCE_PAYMENT_PAYPAL_SUBSCRIPTION_MODE_NVP="Eldre NVP / Express Checkout (J2Store-kompatibel)"

; Configuration - NVP credentials (legacy J2Store BAID renewals — Path C hybrid)
PLG_J2COMMERCE_PAYMENT_PAYPAL_NVP_SECTION_LABEL="NVP API-påloggingsopplysninger (kun for fornyelse av eldre abonnementer)"
PLG_J2COMMERCE_PAYMENT_PAYPAL_NVP_SECTION_DESC="<strong>Kreves KUN når det finnes migrerte J2Store-abonnementer (rader i #__j2commerce_metafields med metakey=billing_agreement_id).</strong> PayPal sluttet å utstede NVP-påloggingsopplysninger til nye forhandlere i 2023 – hvis du er en ny forhandler, la disse feltene stå tomme; abonnementer fra og med dette tidspunktet bruker den moderne REST-prosessen. Eksisterende J2Store-forhandlere: finn api_username, api_password og api_signature i PayPal → Kontoinnstillinger → Kontotilgang → API-tilgang → NVP/SOAP API-integrasjon → Administrer API-påloggingsopplysninger."
PLG_J2COMMERCE_PAYMENT_PAYPAL_NVP_API_USERNAME="NVP API-brukernavn (produksjon)"
PLG_J2COMMERCE_PAYMENT_PAYPAL_NVP_API_USERNAME_DESC="Produksjons-NVP api_username fra «Administrer API-påloggingsopplysninger» i PayPal."
PLG_J2COMMERCE_PAYMENT_PAYPAL_NVP_API_PASSWORD="NVP API-passord (produksjon)"
PLG_J2COMMERCE_PAYMENT_PAYPAL_NVP_API_PASSWORD_DESC="Produksjons-NVP api_password fra «Administrer API-påloggingsopplysninger» i PayPal."
PLG_J2COMMERCE_PAYMENT_PAYPAL_NVP_API_SIGNATURE="NVP API-signatur (produksjon)"
PLG_J2COMMERCE_PAYMENT_PAYPAL_NVP_API_SIGNATURE_DESC="Produksjons-NVP api_signature fra «Administrer API-påloggingsopplysninger» i PayPal."
