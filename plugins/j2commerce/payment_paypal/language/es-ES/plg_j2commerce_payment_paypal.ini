; Configuration - Subscription mode toggle
PLG_J2COMMERCE_PAYMENT_PAYPAL_SUBSCRIPTION_MODE_LABEL="Modo de creación de suscripciones"
PLG_J2COMMERCE_PAYMENT_PAYPAL_SUBSCRIPTION_MODE_DESC="<strong>Controla cómo se crean las NUEVAS suscripciones al finalizar la compra.</strong> Las renovaciones siempre se gestionan mediante metakey, por lo que las suscripciones creadas en cualquiera de los dos modos siguen funcionando cuando se cambia esta opción.<br><br><strong>REST moderno</strong> (predeterminado): el cliente utiliza la ventana emergente de Smart Buttons → programación recurrente por parte de PayPal → la aplicación realiza cobros forzados mediante /v1/billing/subscriptions/{id}/capture. Se almacena como paypal_subscription_id metakey.<br><br><strong>NVP heredado</strong> (compatible con J2Store): el cliente es redirigido al clásico PayPal Express Checkout → se devuelve el BAID → el cron de la aplicación realiza los cobros a través de DoReferenceTransaction. Se almacena como billing_agreement_id metakey. Utilice esta opción al migrar desde J2Store con la intención de que una herramienta de migración convierta posteriormente los BAID heredados a valores paypal_subscription_id modernos."
PLG_J2COMMERCE_PAYMENT_PAYPAL_SUBSCRIPTION_MODE_REST="API moderna de suscripciones REST (Smart Buttons)"
PLG_J2COMMERCE_PAYMENT_PAYPAL_SUBSCRIPTION_MODE_NVP="NVP heredado / Express Checkout (compatible con J2Store)"

; Configuration - NVP credentials (legacy J2Store BAID renewals — Path C hybrid)
PLG_J2COMMERCE_PAYMENT_PAYPAL_NVP_SECTION_LABEL="Credenciales de la API de NVP (solo renovaciones heredadas)"
PLG_J2COMMERCE_PAYMENT_PAYPAL_NVP_SECTION_DESC="<strong>Obligatorio ÚNICAMENTE cuando existan suscripciones migradas de J2Store (filas en #__j2commerce_metafields con metakey=billing_agreement_id).</strong> PayPal dejó de emitir credenciales NVP a nuevos comerciantes en 2023; si es usted un nuevo comerciante, deje estos campos en blanco; a partir de este momento, las suscripciones utilizan el flujo REST moderno. Comerciantes actuales de J2Store: localice api_username, api_password y api_signature en PayPal → Configuración de la cuenta → Acceso a la cuenta → Acceso a la API → Integración de la API NVP/SOAP → Gestionar credenciales de la API."
PLG_J2COMMERCE_PAYMENT_PAYPAL_NVP_API_USERNAME="Nombre de usuario de la API de NVP (producción)"
PLG_J2COMMERCE_PAYMENT_PAYPAL_NVP_API_USERNAME_DESC="api_username de NVP de producción, de la sección «Gestionar credenciales de API» de PayPal."
PLG_J2COMMERCE_PAYMENT_PAYPAL_NVP_API_PASSWORD="Contraseña de la API de NVP (producción)"
PLG_J2COMMERCE_PAYMENT_PAYPAL_NVP_API_PASSWORD_DESC="api_password de NVP de producción, de la sección «Gestionar credenciales de API» de PayPal."
PLG_J2COMMERCE_PAYMENT_PAYPAL_NVP_API_SIGNATURE="Firma de la API de NVP (producción)"
PLG_J2COMMERCE_PAYMENT_PAYPAL_NVP_API_SIGNATURE_DESC="api_signature de NVP de producción, de la sección «Gestionar credenciales de API» de PayPal."
PLG_J2COMMERCE_PAYMENT_PAYPAL_NVP_SANDBOX_API_USERNAME="Nombre de usuario de la API de NVP (sandbox)"
