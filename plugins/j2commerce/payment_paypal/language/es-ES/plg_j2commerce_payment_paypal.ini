; Sandbox subscription test harness (admin-only, sandbox-mode-only)
PLG_J2COMMERCE_PAYMENT_PAYPAL_SANDBOX_TEST_LABEL="Banco de pruebas de suscripciones en sandbox"
PLG_J2COMMERCE_PAYMENT_PAYPAL_SANDBOX_TEST_DESC="<strong>1. Probar credenciales</strong>: comprueba que el client_id de sandbox y el secreto obtienen un token OAuth válido.<br><strong>2. Crear suscripción</strong>: genera un producto real del catálogo, un plan de facturación ($1.00/day × 5 ciclos) y una suscripción en su sandbox. Devuelve una URL de aprobación: haga clic en ella, inicie sesión con una cuenta PERSONAL de sandbox y apruebe.<br><strong>3. Comprobar estado</strong>: pegue el ID de suscripción I-XXXX y confirme que remote_status ha cambiado a ACTIVE tras la aprobación.<br><strong>4. Cancelar</strong>: elimine la suscripción de prueba para que no siga facturando a la cuenta de sandbox."
PLG_J2COMMERCE_PAYMENT_PAYPAL_SANDBOX_TEST_CREDS="1. Probar credenciales"
PLG_J2COMMERCE_PAYMENT_PAYPAL_SANDBOX_TEST_CREATE="2. Crear suscripción de prueba"
PLG_J2COMMERCE_PAYMENT_PAYPAL_SANDBOX_TEST_CHECK="3. Comprobar el estado"
PLG_J2COMMERCE_PAYMENT_PAYPAL_SANDBOX_TEST_CANCEL="4. Cancelar la suscripción de prueba"
PLG_J2COMMERCE_PAYMENT_PAYPAL_SANDBOX_TEST_NVP="5. Probar las credenciales de NVP"
PLG_J2COMMERCE_PAYMENT_PAYPAL_SANDBOX_TEST_SUBID_LABEL="ID de suscripción de PayPal"
PLG_J2COMMERCE_PAYMENT_PAYPAL_SANDBOX_TEST_SUBID_HELP="Se rellena automáticamente tras el paso 2. Se utiliza en «Comprobar el estado» y «Cancelar»."

