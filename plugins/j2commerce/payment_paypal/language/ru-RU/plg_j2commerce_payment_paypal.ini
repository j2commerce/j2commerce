; Configuration - Subscription mode toggle
PLG_J2COMMERCE_PAYMENT_PAYPAL_SUBSCRIPTION_MODE_LABEL="Режим создания подписки"
PLG_J2COMMERCE_PAYMENT_PAYPAL_SUBSCRIPTION_MODE_DESC="<strong>Определяет, как создаются НОВЫЕ подписки при оформлении заказа.</strong> Продления всегда проходят через metakey, поэтому подписки, созданные в любом из режимов, продолжают функционировать при изменении этого переключателя.<br><br><strong>Современный REST</strong> (по умолчанию): клиент использует всплывающее окно «Smart Buttons» → график повторяющихся платежей на стороне PayPal → приложение выполняет принудительное списание средств через /v1/billing/subscriptions/{id}/capture. Сохраняется как paypal_subscription_id metakey.<br><br><strong>Устаревший NVP</strong> (совместимый с J2Store): клиент перенаправляется на классическую страницу PayPal Express Checkout → возвращается BAID → приложение через cron осуществляет списание средств с помощью DoReferenceTransaction. Сохраняется как billing_agreement_id metakey. Используйте этот вариант при миграции из J2Store с расчётом на то, что инструмент миграции впоследствии преобразует устаревшие BAID в современные значения paypal_subscription_id."
PLG_J2COMMERCE_PAYMENT_PAYPAL_SUBSCRIPTION_MODE_REST="Современный REST-API подписок (Smart Buttons)"
PLG_J2COMMERCE_PAYMENT_PAYPAL_SUBSCRIPTION_MODE_NVP="Устаревший NVP / Express Checkout (совместимый с J2Store)"

; Configuration - NVP credentials (legacy J2Store BAID renewals — Path C hybrid)
PLG_J2COMMERCE_PAYMENT_PAYPAL_NVP_SECTION_LABEL="Учётные данные API NVP (только для продления устаревших подписок)"
PLG_J2COMMERCE_PAYMENT_PAYPAL_NVP_SECTION_DESC="<strong>Требуется ТОЛЬКО при наличии мигрированных подписок из J2Store (строки в #__j2commerce_metafields с metakey=billing_agreement_id).</strong> В 2023 году PayPal прекратил выдачу учётных данных NVP новым продавцам — если вы являетесь новым продавцом, оставьте эти поля пустыми; подписки, оформленные с этого момента, используют современный REST-поток. Существующие продавцы J2Store: найдите поля api_username, api_password и api_signature в PayPal → «Настройки учётной записи» → «Доступ к учётной записи» → «Доступ к API» → «Интеграция NVP/SOAP API» → «Управление учётными данными API»."
PLG_J2COMMERCE_PAYMENT_PAYPAL_NVP_API_USERNAME="Имя пользователя API NVP (рабочая среда)"
PLG_J2COMMERCE_PAYMENT_PAYPAL_NVP_API_USERNAME_DESC="NVP api_username для рабочей среды из раздела «Управление учётными данными API» в PayPal."
