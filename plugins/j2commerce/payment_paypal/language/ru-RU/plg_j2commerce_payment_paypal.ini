; Sandbox subscription test harness (admin-only, sandbox-mode-only)
PLG_J2COMMERCE_PAYMENT_PAYPAL_SANDBOX_TEST_LABEL="Тестовый стенд подписок в среде sandbox"
PLG_J2COMMERCE_PAYMENT_PAYPAL_SANDBOX_TEST_DESC="<strong>1. Проверить учётные данные</strong> — проверяет, что client_id среды sandbox и секретный ключ позволяют получить действительный токен OAuth.<br><strong>2. Создать подписку</strong> — формирует реальный товар в каталоге, тарифный план ($1.00/day × 5 циклов) и подписку в вашей среде sandbox. Возвращает URL-адрес утверждения — перейдите по нему, войдите в систему с помощью ЛИЧНОЙ учётной записи в среде sandbox и утвердите.<br><strong>3. Проверить статус</strong> — вставьте идентификатор подписки I-XXXX и убедитесь, что после утверждения статус remote_status изменился на ACTIVE.<br><strong>4. Отменить</strong> — удалите тестовую подписку, чтобы с учётной записи среды sandbox не продолжали списывать средства."
PLG_J2COMMERCE_PAYMENT_PAYPAL_SANDBOX_TEST_CREDS="1. Проверить учётные данные"
PLG_J2COMMERCE_PAYMENT_PAYPAL_SANDBOX_TEST_CREATE="2. Создать тестовую подписку"
PLG_J2COMMERCE_PAYMENT_PAYPAL_SANDBOX_TEST_CHECK="3. Проверить статус"
PLG_J2COMMERCE_PAYMENT_PAYPAL_SANDBOX_TEST_CANCEL="4. Отменить тестовую подписку"
PLG_J2COMMERCE_PAYMENT_PAYPAL_SANDBOX_TEST_NVP="5. Проверить учётные данные NVP"
