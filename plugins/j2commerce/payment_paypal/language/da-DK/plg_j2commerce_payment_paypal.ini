PLG_J2COMMERCE_PAYMENT_PAYPAL_NVP_API_PASSWORD_DESC="Produktions-NVP api_password fra PayPal under »Administrer API-adgangsoplysninger«."
PLG_J2COMMERCE_PAYMENT_PAYPAL_NVP_API_SIGNATURE="NVP API-signatur (produktion)"
PLG_J2COMMERCE_PAYMENT_PAYPAL_NVP_API_SIGNATURE_DESC="Produktions-NVP api_signature fra PayPal under »Administrer API-adgangsoplysninger«."
