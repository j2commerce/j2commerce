PLG_J2COMMERCE_PAYMENT_PAYPAL_PENDING_STATUS="Afventende indfangning af ordrestatus"
PLG_J2COMMERCE_PAYMENT_PAYPAL_PENDING_STATUS_DESC="Ordrestatus, der angives, når PayPal rapporterer en transaktion som \"pending\". Lad feltet være tomt for at bruge den status, der er tilknyttet som \"Open\", eller standardstatusen \"Pending\"."
PLG_J2COMMERCE_PAYMENT_PAYPAL_FAILED_STATUS="Status for mislykket betalingsordre"
PLG_J2COMMERCE_PAYMENT_PAYPAL_FAILED_STATUS_DESC="Ordrestatus, der angives, når PayPal afviser eller tilbagefører en indbetaling. Lad feltet være tomt for at bruge den status, der er tilknyttet som »Failed«, eller den grundlæggende »Failed«-status."
PLG_J2COMMERCE_PAYMENT_PAYPAL_REFUNDED_STATUS="Status for refunderet ordre"
PLG_J2COMMERCE_PAYMENT_PAYPAL_REFUNDED_STATUS_DESC="Ordrestatus, der angives, når en transaktion refunderes via administratorens refusionsknap eller en PayPal-webhook. Lad feltet være tomt for at anvende den status, der er tilknyttet som »Refunded«; hvis ingen status er tilknyttet, forbliver status uændret."
