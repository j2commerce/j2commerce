; Configuration - Subscription mode toggle
PLG_J2COMMERCE_PAYMENT_PAYPAL_SUBSCRIPTION_MODE_LABEL="Tilstand for oprettelse af abonnement"
PLG_J2COMMERCE_PAYMENT_PAYPAL_SUBSCRIPTION_MODE_DESC="<strong>Styrer, hvordan NYE abonnementer oprettes ved kassen.</strong> Fornyelser dirigeres altid via metakey, så abonnementer oprettet i begge tilstande fortsætter med at fungere, når denne indstilling ændres.<br><br><strong>Moderne REST</strong> (standard): kunden bruger pop op-vinduet Smart Buttons → tilbagevendende betalingsplan på PayPal-siden → appen foretager tvungne opkrævninger via /v1/billing/subscriptions/{id}/capture. Gemmes som paypal_subscription_id metakey.<br><br><strong>Ældre NVP</strong> (J2Store-kompatibel): kunden omdirigeres til klassisk PayPal Express Checkout → BAID returneres → appens cron opkræver via DoReferenceTransaction. Gemmes som billing_agreement_id metakey. Brug dette ved migrering fra J2Store med den hensigt, at et migreringsværktøj senere skal konvertere ældre BAID’er til moderne paypal_subscription_id-værdier."
PLG_J2COMMERCE_PAYMENT_PAYPAL_SUBSCRIPTION_MODE_REST="Moderne REST-abonnements-API (Smart Buttons)"
PLG_J2COMMERCE_PAYMENT_PAYPAL_SUBSCRIPTION_MODE_NVP="Ældre NVP / Express Checkout (J2Store-kompatibel)"

; Configuration - NVP credentials (legacy J2Store BAID renewals — Path C hybrid)
PLG_J2COMMERCE_PAYMENT_PAYPAL_NVP_SECTION_LABEL="NVP API-adgangsoplysninger (kun for fornyelser af ældre abonnementer)"
PLG_J2COMMERCE_PAYMENT_PAYPAL_NVP_SECTION_DESC="<strong>Kræves KUN, når der findes migrerede J2Store-abonnementer (rækker i #__j2commerce_metafields med metakey=billing_agreement_id).</strong> PayPal stoppede med at udstede NVP-adgangsoplysninger til nye forhandlere i 2023 — hvis du er en ny forhandler, skal du lade disse felter være tomme; abonnementer fra dette tidspunkt og fremover bruger den moderne REST-proces. Eksisterende J2Store-forhandlere: Find api_username, api_password og api_signature i PayPal → Kontoindstillinger → Kontoadgang → API-adgang → NVP/SOAP API-integration → Administrer API-adgangsoplysninger."
