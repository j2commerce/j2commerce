; Sandbox subscription test harness (admin-only, sandbox-mode-only)
PLG_J2COMMERCE_PAYMENT_PAYPAL_SANDBOX_TEST_LABEL="Testbænk for abonnementer i sandbox"
PLG_J2COMMERCE_PAYMENT_PAYPAL_SANDBOX_TEST_DESC="<strong>1. Test adgangsoplysninger</strong> — verificerer, at sandboxens client_id og hemmelige nøgle kan hente et gyldigt OAuth-token.<br><strong>2. Opret abonnement</strong> — opretter et rigtigt katalogprodukt, en faktureringsplan ($1.00/day × 5 cyklusser) og et abonnement i din sandbox. Returnerer en godkendelses-URL — klik på den, log ind med en PERSONAL-konto i sandboxen, og godkend.<br><strong>3. Kontroller status</strong> — indsæt I-XXXX-abonnements-id’et, og bekræft, at remote_status er skiftet til ACTIVE efter godkendelse.<br><strong>4. Annuller</strong> — ryd op i testabonnementet, så det ikke fortsætter med at opkræve betaling fra sandbox-kontoen."
PLG_J2COMMERCE_PAYMENT_PAYPAL_SANDBOX_TEST_CREDS="1. Test adgangsoplysninger"
PLG_J2COMMERCE_PAYMENT_PAYPAL_SANDBOX_TEST_CREATE="2. Opret testabonnement"
PLG_J2COMMERCE_PAYMENT_PAYPAL_SANDBOX_TEST_CHECK="3. Kontroller status"
PLG_J2COMMERCE_PAYMENT_PAYPAL_SANDBOX_TEST_CANCEL="4. Annuller testabonnement"
PLG_J2COMMERCE_PAYMENT_PAYPAL_SANDBOX_TEST_NVP="5. Test NVP-adgangsoplysninger"
PLG_J2COMMERCE_PAYMENT_PAYPAL_SANDBOX_TEST_SUBID_LABEL="PayPal-abonnements-id"
PLG_J2COMMERCE_PAYMENT_PAYPAL_SANDBOX_TEST_SUBID_HELP="Udfyldes automatisk efter trin 2. Anvendes af »Kontroller status« / »Annuller«."

