PLG_J2COMMERCE_PAYMENT_PAYPAL_NVP_API_SIGNATURE="חתימת API של NVP (סביבת ייצור)"
PLG_J2COMMERCE_PAYMENT_PAYPAL_NVP_API_SIGNATURE_DESC="NVP בסביבת ייצור api_signature מתוך ‚ניהול פרטי הזדהות API’ ב-PayPal."
