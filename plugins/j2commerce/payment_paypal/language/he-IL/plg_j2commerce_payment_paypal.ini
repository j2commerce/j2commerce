; Configuration - Subscription mode toggle
PLG_J2COMMERCE_PAYMENT_PAYPAL_SUBSCRIPTION_MODE_LABEL="מצב יצירת מנוי"
PLG_J2COMMERCE_PAYMENT_PAYPAL_SUBSCRIPTION_MODE_DESC="<strong>קובע כיצד נוצרים מנויים חדשים בעת התשלום.</strong> חידושים תמיד מנותבים דרך metakey, כך שמנויים שנוצרו בכל אחד מהמצבים ימשיכו לפעול גם כאשר מתג זה ישתנה.<br><br><strong>REST מודרני</strong> (ברירת מחדל): הלקוח משתמש בחלון הקופץ של Smart Buttons → לוח זמנים חוזר בצד PayPal → cron של האפליקציה מבצע חיוב כפוי באמצעות /v1/billing/subscriptions/{id}/capture. מאוחסן כ-paypal_subscription_id metakey.<br><br><strong>NVP ישן</strong> (תואם J2Store): הלקוח מועבר ל-PayPal Express Checkout הקלאסי → BAID מוחזר → cron של האפליקציה גובה תשלום באמצעות DoReferenceTransaction. מאוחסן כ-billing_agreement_id metakey. השתמשו באפשרות זו בעת מעבר מ-J2Store, מתוך כוונה שכלי המעבר ימיר בהמשך את ערכי ה-BAID הישנים לערכי paypal_subscription_id מודרניים."
PLG_J2COMMERCE_PAYMENT_PAYPAL_SUBSCRIPTION_MODE_REST="ממשק ה-API המודרני של REST למנויים (Smart Buttons)"
PLG_J2COMMERCE_PAYMENT_PAYPAL_SUBSCRIPTION_MODE_NVP="NVP ישן / Express Checkout (תואם J2Store)"

; Configuration - NVP credentials (legacy J2Store BAID renewals — Path C hybrid)
PLG_J2COMMERCE_PAYMENT_PAYPAL_NVP_SECTION_LABEL="פרטי הזדהות API של NVP (לחידושים ישנים בלבד)"
PLG_J2COMMERCE_PAYMENT_PAYPAL_NVP_SECTION_DESC="<strong>נדרש אך ורק כאשר קיימים מנויים שעברו הגירה מ-J2Store (שורות ב-#__j2commerce_metafields עם metakey=billing_agreement_id).</strong> PayPal הפסיקה להנפיק פרטי הזדהות NVP לסוחרים חדשים בשנת 2023 — אם אתם סוחרים חדשים, השאירו שדות אלה ריקים; מנויים מעתה והלאה ישתמשו בזרימת REST המודרנית. סוחרים קיימים ב-J2Store: אתרו את api_username, api_password ו-api_signature ב-PayPal → הגדרות חשבון → גישה לחשבון → גישה ל-API → שילוב API NVP/SOAP → ניהול פרטי הזדהות ל-API."
PLG_J2COMMERCE_PAYMENT_PAYPAL_NVP_API_USERNAME="שם משתמש API של NVP (סביבת ייצור)"
PLG_J2COMMERCE_PAYMENT_PAYPAL_NVP_API_USERNAME_DESC="NVP בסביבת ייצור api_username מתוך ‚ניהול פרטי הזדהות API’ ב-PayPal."
