; Sandbox subscription test harness (admin-only, sandbox-mode-only)
PLG_J2COMMERCE_PAYMENT_PAYPAL_SANDBOX_TEST_LABEL="מעבדת בדיקות מנויים בסביבת בדיקה"
PLG_J2COMMERCE_PAYMENT_PAYPAL_SANDBOX_TEST_DESC="<strong>1. בדיקת פרטי הזדהות</strong> — מאמת שה-client_id של סביבת הבדיקה והמפתח הסודי משיגים אסימון OAuth תקף.<br><strong>2. יצירת מנוי</strong> — יוצר מוצר קטלוג אמיתי, תוכנית חיוב ($1.00/day × 5 מחזורים) ומנוי בסביבת הבדיקה שלכם. מחזיר כתובת URL לאישור — לחצו עליה, התחברו עם חשבון PERSONAL בסביבת הבדיקה ואשרו.<br><strong>3. בדיקת סטטוס</strong> — הדביקו את מזהה המנוי I-XXXX וּודאו ש-remote_status השתנה ל-ACTIVE לאחר האישור.<br><strong>4. ביטול</strong> — נקו את המנוי הניסיוני כדי שלא ימשיך לחייב את חשבון סביבת הבדיקה."
PLG_J2COMMERCE_PAYMENT_PAYPAL_SANDBOX_TEST_CREDS="1. בדיקת פרטי הזדהות"
