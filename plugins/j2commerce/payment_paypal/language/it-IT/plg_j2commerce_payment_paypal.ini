; Configuration - Subscription mode toggle
PLG_J2COMMERCE_PAYMENT_PAYPAL_SUBSCRIPTION_MODE_LABEL="Modalità di creazione dell’abbonamento"
PLG_J2COMMERCE_PAYMENT_PAYPAL_SUBSCRIPTION_MODE_DESC="<strong>Determina le modalità di creazione dei NUOVI abbonamenti al momento del checkout.</strong> I rinnovi vengono sempre instradati tramite metakey, pertanto gli abbonamenti creati in entrambe le modalità continuano a funzionare anche quando si modifica questa opzione.<br><br><strong>REST moderno</strong> (impostazione predefinita): il cliente utilizza il popup Smart Buttons → pianificazione ricorrente lato PayPal → l’app esegue l’addebito forzato tramite /v1/billing/subscriptions/{id}/capture. Memorizzato come paypal_subscription_id metakey.<br><br><strong>NVP legacy</strong> (compatibile con J2Store): il cliente viene reindirizzato al classico PayPal Express Checkout → viene restituito il BAID → il cron dell’app effettua l’addebito tramite DoReferenceTransaction. Memorizzato come billing_agreement_id metakey. Utilizzare questa opzione in caso di migrazione da J2Store, con l’intenzione che uno strumento di migrazione converta successivamente i BAID legacy nei valori paypal_subscription_id moderni."
PLG_J2COMMERCE_PAYMENT_PAYPAL_SUBSCRIPTION_MODE_REST="API REST moderna per gli abbonamenti (Smart Buttons)"
PLG_J2COMMERCE_PAYMENT_PAYPAL_SUBSCRIPTION_MODE_NVP="NVP legacy / Express Checkout (compatibile con J2Store)"

; Configuration - NVP credentials (legacy J2Store BAID renewals — Path C hybrid)
PLG_J2COMMERCE_PAYMENT_PAYPAL_NVP_SECTION_LABEL="Credenziali API NVP (solo per rinnovi legacy)"
PLG_J2COMMERCE_PAYMENT_PAYPAL_NVP_SECTION_DESC="<strong>Richiesto SOLO in presenza di abbonamenti J2Store migrati (righe in #__j2commerce_metafields con metakey=billing_agreement_id).</strong> PayPal ha smesso di rilasciare credenziali NVP ai nuovi esercenti nel 2023: se è un nuovo esercente, lasci questi campi vuoti; gli abbonamenti a partire da questo momento utilizzano il flusso REST moderno. Esercenti J2Store esistenti: individuare api_username, api_password e api_signature in PayPal → Impostazioni account → Accesso all’account → Accesso API → Integrazione API NVP/SOAP → Gestisci credenziali API."
PLG_J2COMMERCE_PAYMENT_PAYPAL_NVP_API_USERNAME="Nome utente API NVP (produzione)"
PLG_J2COMMERCE_PAYMENT_PAYPAL_NVP_API_USERNAME_DESC="api_username NVP di produzione, da «Gestisci credenziali API» di PayPal."
PLG_J2COMMERCE_PAYMENT_PAYPAL_NVP_API_PASSWORD="Password API NVP (produzione)"
PLG_J2COMMERCE_PAYMENT_PAYPAL_NVP_API_PASSWORD_DESC="api_password NVP di produzione, da «Gestisci credenziali API» di PayPal."
PLG_J2COMMERCE_PAYMENT_PAYPAL_NVP_API_SIGNATURE="Firma API NVP (produzione)"
PLG_J2COMMERCE_PAYMENT_PAYPAL_NVP_API_SIGNATURE_DESC="api_signature NVP di produzione, da «Gestisci credenziali API» di PayPal."
PLG_J2COMMERCE_PAYMENT_PAYPAL_NVP_SANDBOX_API_USERNAME="Nome utente API NVP (sandbox)"
PLG_J2COMMERCE_PAYMENT_PAYPAL_NVP_SANDBOX_API_USERNAME_DESC="api_username NVP di sandbox, per testare i rinnovi BAID legacy."
