; Sandbox subscription test harness (admin-only, sandbox-mode-only)
PLG_J2COMMERCE_PAYMENT_PAYPAL_SANDBOX_TEST_LABEL="Banco di prova degli abbonamenti in sandbox"
PLG_J2COMMERCE_PAYMENT_PAYPAL_SANDBOX_TEST_DESC="<strong>1. Verifica credenziali</strong> — verifica che il client_id di sandbox e il segreto consentano di ottenere un token OAuth valido.<br><strong>2. Crea abbonamento</strong> — crea un prodotto reale del catalogo, un piano di fatturazione ($1.00/day × 5 cicli) e un abbonamento nella propria sandbox. Restituisce un URL di approvazione — fare clic su di esso, effettuare l’accesso con un account PERSONAL della sandbox e approvare.<br><strong>3. Verifica stato</strong> — incollare l’ID dell’abbonamento I-XXXX e verificare che remote_status sia passato a ACTIVE dopo l’approvazione.<br><strong>4. Annulla</strong> — eliminare l’abbonamento di prova in modo che non continui ad addebitare l’account della sandbox."
PLG_J2COMMERCE_PAYMENT_PAYPAL_SANDBOX_TEST_CREDS="1. Verifica credenziali"
PLG_J2COMMERCE_PAYMENT_PAYPAL_SANDBOX_TEST_CREATE="2. Crea abbonamento di prova"
PLG_J2COMMERCE_PAYMENT_PAYPAL_SANDBOX_TEST_CHECK="3. Verifica stato"
PLG_J2COMMERCE_PAYMENT_PAYPAL_SANDBOX_TEST_CANCEL="4. Annulla abbonamento di prova"
PLG_J2COMMERCE_PAYMENT_PAYPAL_SANDBOX_TEST_NVP="5. Verifica credenziali NVP"
PLG_J2COMMERCE_PAYMENT_PAYPAL_SANDBOX_TEST_SUBID_LABEL="ID abbonamento PayPal"
PLG_J2COMMERCE_PAYMENT_PAYPAL_SANDBOX_TEST_SUBID_HELP="Compilato automaticamente dopo il passaggio 2. Utilizzato dalle funzioni «Verifica stato» e «Annulla»."

