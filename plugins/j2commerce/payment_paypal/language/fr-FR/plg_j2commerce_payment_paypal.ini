; Sandbox subscription test harness (admin-only, sandbox-mode-only)
PLG_J2COMMERCE_PAYMENT_PAYPAL_SANDBOX_TEST_LABEL="Banc de test des abonnements en sandbox"
PLG_J2COMMERCE_PAYMENT_PAYPAL_SANDBOX_TEST_DESC="<strong>1. Tester les identifiants</strong> — vérifie que le client_id de sandbox et le secret permettent d’obtenir un jeton OAuth valide.<br><strong>2. Créer un abonnement</strong> — crée un produit réel du catalogue, un plan de facturation ($1.00/day × 5 cycles) et un abonnement dans votre sandbox. Renvoie une URL d’approbation — cliquez dessus, connectez-vous avec un compte PERSONNEL de la sandbox, puis approuvez.<br><strong>3. Vérifier l’état</strong> — collez l’identifiant d’abonnement I-XXXX et vérifiez que remote_status passe à ACTIVE après approbation.<br><strong>4. Annuler</strong> — supprimez l’abonnement de test afin qu’il ne continue pas à facturer le compte de la sandbox."
PLG_J2COMMERCE_PAYMENT_PAYPAL_SANDBOX_TEST_CREDS="1. Tester les identifiants"
PLG_J2COMMERCE_PAYMENT_PAYPAL_SANDBOX_TEST_CREATE="2. Créer un abonnement de test"
PLG_J2COMMERCE_PAYMENT_PAYPAL_SANDBOX_TEST_CHECK="3. Vérifier l’état"
PLG_J2COMMERCE_PAYMENT_PAYPAL_SANDBOX_TEST_CANCEL="4. Annuler l’abonnement de test"
PLG_J2COMMERCE_PAYMENT_PAYPAL_SANDBOX_TEST_NVP="5. Tester les identifiants NVP"
PLG_J2COMMERCE_PAYMENT_PAYPAL_SANDBOX_TEST_SUBID_LABEL="Identifiant d’abonnement PayPal"
PLG_J2COMMERCE_PAYMENT_PAYPAL_SANDBOX_TEST_SUBID_HELP="Rempli automatiquement après l’étape 2. Utilisé par les options « Vérifier l’état » et « Annuler »."

