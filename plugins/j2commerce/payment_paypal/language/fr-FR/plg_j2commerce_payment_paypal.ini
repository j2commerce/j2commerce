; Configuration - Subscription mode toggle
PLG_J2COMMERCE_PAYMENT_PAYPAL_SUBSCRIPTION_MODE_LABEL="Mode de création d’abonnement"
PLG_J2COMMERCE_PAYMENT_PAYPAL_SUBSCRIPTION_MODE_DESC="<strong>Détermine la manière dont les NOUVEAUX abonnements sont créés lors du paiement.</strong> Les renouvellements passent toujours par metakey ; ainsi, les abonnements créés dans l’un ou l’autre mode continuent de fonctionner lorsque ce paramètre est modifié.<br><br><strong>REST moderne</strong> (par défaut) : le client utilise la fenêtre contextuelle « Smart Buttons » → calendrier de prélèvements récurrents côté PayPal → l’application effectue des prélèvements forcés via /v1/billing/subscriptions/{id}/capture. Enregistré sous la forme paypal_subscription_id metakey.<br><br><strong>NVP hérité</strong> (compatible J2Store) : le client est redirigé vers le paiement PayPal Express classique → le BAID est renvoyé → le cron de l’application effectue le prélèvement via DoReferenceTransaction. Enregistré sous la forme billing_agreement_id metakey. Utilisez cette option lors d’une migration depuis J2Store, en prévoyant qu’un outil de migration convertira ultérieurement les BAID hérités en valeurs paypal_subscription_id modernes."
PLG_J2COMMERCE_PAYMENT_PAYPAL_SUBSCRIPTION_MODE_REST="API moderne des abonnements REST (Smart Buttons)"
PLG_J2COMMERCE_PAYMENT_PAYPAL_SUBSCRIPTION_MODE_NVP="NVP hérité / Express Checkout (compatible avec J2Store)"

; Configuration - NVP credentials (legacy J2Store BAID renewals — Path C hybrid)
PLG_J2COMMERCE_PAYMENT_PAYPAL_NVP_SECTION_LABEL="Identifiants de l’API NVP (renouvellements hérités uniquement)"
PLG_J2COMMERCE_PAYMENT_PAYPAL_NVP_SECTION_DESC="<strong>Requis UNIQUEMENT en cas d’existence d’abonnements J2Store migrés (lignes dans #__j2commerce_metafields où metakey = billing_agreement_id).</strong> PayPal a cessé de délivrer des identifiants NVP aux nouveaux commerçants en 2023 — si vous êtes un nouveau commerçant, laissez ces champs vides ; les abonnements souscrits à partir de cette date utilisent le flux REST moderne. Commerçants J2Store existants : repérez api_username, api_password et api_signature dans PayPal → Paramètres du compte → Accès au compte → Accès à l’API → Intégration API NVP/SOAP → Gérer les identifiants API."
PLG_J2COMMERCE_PAYMENT_PAYPAL_NVP_API_USERNAME="Nom d’utilisateur de l’API NVP (production)"
PLG_J2COMMERCE_PAYMENT_PAYPAL_NVP_API_USERNAME_DESC="api_username NVP de production, issu de la section « Gérer les identifiants API » de PayPal."
PLG_J2COMMERCE_PAYMENT_PAYPAL_NVP_API_PASSWORD="Mot de passe de l’API NVP (production)"
PLG_J2COMMERCE_PAYMENT_PAYPAL_NVP_API_PASSWORD_DESC="api_password NVP de production, issu de la section « Gérer les identifiants API » de PayPal."
PLG_J2COMMERCE_PAYMENT_PAYPAL_NVP_API_SIGNATURE="Signature de l’API NVP (production)"
PLG_J2COMMERCE_PAYMENT_PAYPAL_NVP_API_SIGNATURE_DESC="api_signature NVP de production, issu de la section « Gérer les identifiants API » de PayPal."
PLG_J2COMMERCE_PAYMENT_PAYPAL_NVP_SANDBOX_API_USERNAME="Nom d’utilisateur de l’API NVP (sandbox)"
PLG_J2COMMERCE_PAYMENT_PAYPAL_NVP_SANDBOX_API_USERNAME_DESC="api_username NVP de sandbox, pour tester les renouvellements BAID hérités."
PLG_J2COMMERCE_PAYMENT_PAYPAL_NVP_SANDBOX_API_PASSWORD="Mot de passe de l’API NVP (sandbox)"
