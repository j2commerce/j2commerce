PLG_J2COMMERCE_PAYMENT_PAYPAL_REFUNDED_STATUS="Status van terugbetaalde bestelling"
PLG_J2COMMERCE_PAYMENT_PAYPAL_REFUNDED_STATUS_DESC="Bestelstatus die wordt vastgelegd wanneer een transactie wordt terugbetaald, via de terugbetalingsknop in het beheerdersgedeelte of een PayPal-webhook. Laat dit veld leeg om de status te gebruiken die is toegewezen als ‘Terugbetaald’; indien er geen status is toegewezen, blijft de status ongewijzigd."
