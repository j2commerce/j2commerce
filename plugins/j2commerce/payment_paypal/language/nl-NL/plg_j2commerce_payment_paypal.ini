PLG_J2COMMERCE_PAYMENT_PAYPAL_NVP_API_PASSWORD_DESC="Live NVP api_password uit PayPal ‘API-inloggegevens beheren’."
PLG_J2COMMERCE_PAYMENT_PAYPAL_NVP_API_SIGNATURE="NVP API-handtekening (live)"
PLG_J2COMMERCE_PAYMENT_PAYPAL_NVP_API_SIGNATURE_DESC="Live NVP api_signature uit PayPal ‘API-inloggegevens beheren’."
PLG_J2COMMERCE_PAYMENT_PAYPAL_NVP_SANDBOX_API_USERNAME="NVP API-gebruikersnaam (sandbox)"
PLG_J2COMMERCE_PAYMENT_PAYPAL_NVP_SANDBOX_API_USERNAME_DESC="Sandbox NVP api_username voor het testen van verlengingen van verouderde BAID’s."
PLG_J2COMMERCE_PAYMENT_PAYPAL_NVP_SANDBOX_API_PASSWORD="NVP API-wachtwoord (sandbox)"
