PLG_J2COMMERCE_PAYMENT_PAYPAL_PENDING_STATUS_DESC="Bestelstatus die wordt weergegeven wanneer PayPal een transactie als ‘in afwachting’ rapporteert. Laat dit veld leeg om de status te gebruiken die is toegewezen als ‘Open’, of de standaardstatus ‘In afwachting’."
