; Sandbox subscription test harness (admin-only, sandbox-mode-only)
PLG_J2COMMERCE_PAYMENT_PAYPAL_SANDBOX_TEST_LABEL="Sandbox-testomgeving voor abonnementen"
PLG_J2COMMERCE_PAYMENT_PAYPAL_SANDBOX_TEST_DESC="<strong>1. Inloggegevens testen</strong> — verifieert of de sandbox-client_id en het geheim een geldig OAuth-token opleveren.<br><strong>2. Abonnement aanmaken</strong> — maakt een echt catalogusproduct, een factureringsplan ($1.00/day × 5 cycli) en een abonnement aan in uw sandbox. Geeft een goedkeurings-URL weer — klik hierop, log in met een sandbox PERSONAL-account en keur het goed.<br><strong>3. Status controleren</strong> — plak het I-XXXX abonnements-ID en controleer of remote_status na goedkeuring is gewijzigd in ACTIVE.<br><strong>4. Annuleren</strong> — ruim het testabonnement op, zodat er geen kosten meer in rekening worden gebracht op de sandbox-account."
PLG_J2COMMERCE_PAYMENT_PAYPAL_SANDBOX_TEST_CREDS="1. Inloggegevens testen"
PLG_J2COMMERCE_PAYMENT_PAYPAL_SANDBOX_TEST_CREATE="2. Testabonnement aanmaken"
PLG_J2COMMERCE_PAYMENT_PAYPAL_SANDBOX_TEST_CHECK="3. Status controleren"
PLG_J2COMMERCE_PAYMENT_PAYPAL_SANDBOX_TEST_CANCEL="4. Testabonnement annuleren"
PLG_J2COMMERCE_PAYMENT_PAYPAL_SANDBOX_TEST_NVP="5. NVP-inloggegevens testen"
PLG_J2COMMERCE_PAYMENT_PAYPAL_SANDBOX_TEST_SUBID_LABEL="PayPal-abonnements-ID"
PLG_J2COMMERCE_PAYMENT_PAYPAL_SANDBOX_TEST_SUBID_HELP="Wordt automatisch ingevuld na stap 2. Wordt gebruikt bij ‘Status controleren’ en ‘Annuleren’."

