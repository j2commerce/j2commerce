; Configuration - Subscription mode toggle
PLG_J2COMMERCE_PAYMENT_PAYPAL_SUBSCRIPTION_MODE_LABEL="Modus voor het aanmaken van abonnementen"
PLG_J2COMMERCE_PAYMENT_PAYPAL_SUBSCRIPTION_MODE_DESC="<strong>Bepaalt hoe NIEUWE abonnementen worden aangemaakt bij het afrekenen.</strong> Verlengingen worden altijd via metakey verwerkt, zodat abonnementen die in beide modi zijn aangemaakt, blijven functioneren wanneer deze schakelaar wordt gewijzigd.<br><br><strong>Modern REST</strong> (standaard): de klant gebruikt de pop-up ‘Smart Buttons’ → terugkerend schema aan de PayPal-zijde → de app voert via /v1/billing/subscriptions/{id}/capture een gedwongen afschrijving uit. Opgeslagen als paypal_subscription_id metakey.<br><br><strong>Legacy NVP</strong> (compatibel met J2Store): de klant wordt doorgestuurd naar de klassieke PayPal Express Checkout → BAID wordt geretourneerd → de app voert via DoReferenceTransaction een cron-afschrijving uit. Opgeslagen als billing_agreement_id metakey. Gebruik dit bij migratie vanuit J2Store, met de bedoeling dat een migratietool later verouderde BAID’s omzet naar moderne paypal_subscription_id-waarden."
PLG_J2COMMERCE_PAYMENT_PAYPAL_SUBSCRIPTION_MODE_REST="Moderne REST-abonnements-API (Smart Buttons)"
PLG_J2COMMERCE_PAYMENT_PAYPAL_SUBSCRIPTION_MODE_NVP="Legacy NVP / Express Checkout (compatibel met J2Store)"

; Configuration - NVP credentials (legacy J2Store BAID renewals — Path C hybrid)
PLG_J2COMMERCE_PAYMENT_PAYPAL_NVP_SECTION_LABEL="NVP API-inloggegevens (uitsluitend voor verlenging van verouderde abonnementen)"
PLG_J2COMMERCE_PAYMENT_PAYPAL_NVP_SECTION_DESC="<strong>ALLEEN vereist wanneer er gemigreerde J2Store-abonnementen bestaan (rijen in #__j2commerce_metafields met metakey=billing_agreement_id).</strong> PayPal is in 2023 gestopt met het verstrekken van NVP-inloggegevens aan nieuwe handelaren — indien u een nieuwe handelaar bent, laat u deze velden leeg; abonnementen vanaf dit moment maken gebruik van de moderne REST-workflow. Bestaande J2Store-handelaars: zoek api_username, api_password en api_signature op in PayPal → Accountinstellingen → Accounttoegang → API-toegang → NVP/SOAP API-integratie → API-inloggegevens beheren."
PLG_J2COMMERCE_PAYMENT_PAYPAL_NVP_API_USERNAME="NVP API-gebruikersnaam (live)"
PLG_J2COMMERCE_PAYMENT_PAYPAL_NVP_API_USERNAME_DESC="Live NVP api_username uit PayPal ‘API-inloggegevens beheren’."
