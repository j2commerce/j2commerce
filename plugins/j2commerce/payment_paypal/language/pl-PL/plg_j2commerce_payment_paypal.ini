; Sandbox subscription test harness (admin-only, sandbox-mode-only)
PLG_J2COMMERCE_PAYMENT_PAYPAL_SANDBOX_TEST_LABEL="Środowisko testowe subskrypcji w sandbox"
PLG_J2COMMERCE_PAYMENT_PAYPAL_SANDBOX_TEST_DESC="<strong>1. Sprawdź dane uwierzytelniające</strong> — weryfikuje, czy client_id środowiska sandbox oraz klucz tajny pozwalają uzyskać ważny token OAuth.<br><strong>2. Utwórz subskrypcję</strong> — tworzy rzeczywisty produkt z katalogu, plan rozliczeniowy ($1.00/day × 5 cykli) oraz subskrypcję w Państwa środowisku sandbox. Zwraca adres URL zatwierdzenia — proszę kliknąć ten link, zalogować się na konto PERSONAL w środowisku sandbox i zatwierdzić.<br><strong>3. Sprawdź status</strong> — proszę wkleić identyfikator subskrypcji I-XXXX i potwierdzić, że po zatwierdzeniu status remote_status zmienił się na ACTIVE.<br><strong>4. Anuluj</strong> — proszę usunąć subskrypcję testową, aby nie obciążała ona dalej konta w środowisku sandbox."
PLG_J2COMMERCE_PAYMENT_PAYPAL_SANDBOX_TEST_CREDS="1. Sprawdź dane uwierzytelniające"
PLG_J2COMMERCE_PAYMENT_PAYPAL_SANDBOX_TEST_CREATE="2. Utwórz subskrypcję testową"
PLG_J2COMMERCE_PAYMENT_PAYPAL_SANDBOX_TEST_CHECK="3. Sprawdź status"
PLG_J2COMMERCE_PAYMENT_PAYPAL_SANDBOX_TEST_CANCEL="4. Anuluj subskrypcję testową"
PLG_J2COMMERCE_PAYMENT_PAYPAL_SANDBOX_TEST_NVP="5. Sprawdź dane uwierzytelniające NVP"
PLG_J2COMMERCE_PAYMENT_PAYPAL_SANDBOX_TEST_SUBID_LABEL="Identyfikator subskrypcji PayPal"
PLG_J2COMMERCE_PAYMENT_PAYPAL_SANDBOX_TEST_SUBID_HELP="Wypełniane automatycznie po kroku 2. Wykorzystywane przez funkcje „Sprawdź status” / „Anuluj”."

