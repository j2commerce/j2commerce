; Configuration - Subscription mode toggle
PLG_J2COMMERCE_PAYMENT_PAYPAL_SUBSCRIPTION_MODE_LABEL="Tryb tworzenia subskrypcji"
PLG_J2COMMERCE_PAYMENT_PAYPAL_SUBSCRIPTION_MODE_DESC="<strong>Określa sposób tworzenia NOWYCH subskrypcji podczas finalizacji transakcji.</strong> Odnowienia są zawsze kierowane przez metakey, dzięki czemu subskrypcje utworzone w dowolnym trybie nadal działają po zmianie tego przełącznika.<br><br><strong>Nowoczesny REST</strong> (domyślnie): klient korzysta z wyskakującego okienka „Smart Buttons” → harmonogram płatności cyklicznych po stronie PayPal → aplikacja wymusza pobranie opłaty za pomocą /v1/billing/subscriptions/{id}/capture. Zapisywane jako paypal_subscription_id metakey.<br><br><strong>Starszy standard NVP</strong> (kompatybilny z J2Store): klient jest przekierowywany do klasycznej usługi PayPal Express Checkout → zwracany jest identyfikator BAID → aplikacja pobiera opłatę za pomocą zaplanowanego zadania cron poprzez DoReferenceTransaction. Zapisywane jako billing_agreement_id metakey. Należy skorzystać z tej opcji podczas migracji z J2Store, zakładając, że narzędzie migracyjne przekształci później starsze identyfikatory BAID na nowoczesne wartości paypal_subscription_id."
PLG_J2COMMERCE_PAYMENT_PAYPAL_SUBSCRIPTION_MODE_REST="Nowoczesny interfejs API subskrypcji REST (Smart Buttons)"
PLG_J2COMMERCE_PAYMENT_PAYPAL_SUBSCRIPTION_MODE_NVP="Starsza wersja NVP / Express Checkout (kompatybilna z J2Store)"

; Configuration - NVP credentials (legacy J2Store BAID renewals — Path C hybrid)
PLG_J2COMMERCE_PAYMENT_PAYPAL_NVP_SECTION_LABEL="Dane uwierzytelniające API NVP (wyłącznie w przypadku odnowień starszych subskrypcji)"
PLG_J2COMMERCE_PAYMENT_PAYPAL_NVP_SECTION_DESC="<strong>Wymagane WYŁĄCZNIE w przypadku istnienia subskrypcji przeniesionych z J2Store (wiersze w #__j2commerce_metafields z metakey=billing_agreement_id).</strong> W 2023 r. firma PayPal zaprzestała wydawania poświadczeń NVP nowym akceptantom — jeśli jest Pan/Pani nowym akceptantem, proszę pozostawić te pola puste; subskrypcje od tego momentu wykorzystują nowoczesny przepływ REST. Obecni akceptanci J2Store: proszę odnaleźć pola api_username, api_password i api_signature w serwisie PayPal → Ustawienia konta → Dostęp do konta → Dostęp do API → Integracja z API NVP/SOAP → Zarządzaj danymi uwierzytelniającymi API."
PLG_J2COMMERCE_PAYMENT_PAYPAL_NVP_API_USERNAME="Nazwa użytkownika API NVP (środowisko produkcyjne)"
PLG_J2COMMERCE_PAYMENT_PAYPAL_NVP_API_USERNAME_DESC="NVP api_username dla środowiska produkcyjnego z sekcji „Zarządzaj poświadczeniami API” w serwisie PayPal."
PLG_J2COMMERCE_PAYMENT_PAYPAL_NVP_API_PASSWORD="Hasło API NVP (środowisko produkcyjne)"
PLG_J2COMMERCE_PAYMENT_PAYPAL_NVP_API_PASSWORD_DESC="NVP api_password dla środowiska produkcyjnego z sekcji „Zarządzaj poświadczeniami API” w serwisie PayPal."
PLG_J2COMMERCE_PAYMENT_PAYPAL_NVP_API_SIGNATURE="Podpis API NVP (środowisko produkcyjne)"
PLG_J2COMMERCE_PAYMENT_PAYPAL_NVP_API_SIGNATURE_DESC="NVP api_signature dla środowiska produkcyjnego z sekcji „Zarządzaj poświadczeniami API” w serwisie PayPal."
