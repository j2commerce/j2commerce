PLG_J2COMMERCE_PAYMENT_PAYPAL_PENDING_STATUS="Status zamówienia: Oczekujące na realizację"
PLG_J2COMMERCE_PAYMENT_PAYPAL_PENDING_STATUS_DESC="Status zamówienia zapisywany w momencie, gdy system PayPal zgłasza, że transakcja jest w toku. Proszę pozostawić to pole puste, aby użyć statusu przypisanego jako „Otwarte” lub podstawowego statusu „W toku”."
PLG_J2COMMERCE_PAYMENT_PAYPAL_FAILED_STATUS="Status zlecenia płatniczego: nieudana płatność"
PLG_J2COMMERCE_PAYMENT_PAYPAL_FAILED_STATUS_DESC="Status zamówienia zapisywany w przypadku, gdy PayPal odrzuci lub cofnie transakcję. Proszę pozostawić to pole puste, aby użyć statusu przypisanego jako „Failed” lub podstawowego statusu „Failed”."
PLG_J2COMMERCE_PAYMENT_PAYPAL_REFUNDED_STATUS="Status zamówienia z refundacją"
PLG_J2COMMERCE_PAYMENT_PAYPAL_REFUNDED_STATUS_DESC="Status zamówienia zapisywany w momencie zwrotu środków za transakcję, za pośrednictwem przycisku zwrotu w panelu administracyjnym lub webhooka serwisu PayPal. Proszę pozostawić to pole puste, aby użyć statusu przypisanego jako „Zwrócone”; jeśli żaden status nie został przypisany, status pozostaje niezmieniony."
