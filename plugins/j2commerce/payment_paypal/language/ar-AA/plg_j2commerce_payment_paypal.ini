PLG_J2COMMERCE_PAYMENT_PAYPAL_NVP_API_PASSWORD="كلمة مرور واجهة برمجة تطبيقات NVP (بيئة الإنتاج)"
PLG_J2COMMERCE_PAYMENT_PAYPAL_NVP_API_PASSWORD_DESC="NVP الخاص ببيئة الإنتاج api_password من «إدارة بيانات اعتماد واجهة برمجة التطبيقات» في PayPal."
