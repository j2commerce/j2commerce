; Sandbox subscription test harness (admin-only, sandbox-mode-only)
PLG_J2COMMERCE_PAYMENT_PAYPAL_SANDBOX_TEST_LABEL="منصة اختبار الاشتراكات في بيئة الاختبار"
PLG_J2COMMERCE_PAYMENT_PAYPAL_SANDBOX_TEST_DESC="<strong>1. اختبار بيانات الاعتماد</strong> — يتحقق من أن client_id الخاص ببيئة الاختبار والمفتاح السري يحصلان على رمز OAuth صالح.<br><strong>2. إنشاء اشتراك</strong> — ينشئ منتجًا حقيقيًّا في الكتالوج، وخطة فوترة ($1.00/day × 5 دورات)، واشتراكًا في بيئة الاختبار الخاصة بك. يعرض رابط الموافقة — انقر عليه، وسجّل الدخول باستخدام حساب PERSONAL في بيئة الاختبار، ثم وافق.<br><strong>3. التحقق من الحالة</strong> — الصق معرّف الاشتراك I-XXXX وتأكد من أن remote_status قد تحولت إلى ACTIVE بعد الموافقة.<br><strong>4. إلغاء</strong> — قم بإزالة الاشتراك التجريبي حتى لا يستمر في فرض رسوم على حساب بيئة الاختبار."
PLG_J2COMMERCE_PAYMENT_PAYPAL_SANDBOX_TEST_CREDS="1. اختبار بيانات الاعتماد"
