; Configuration - Subscription mode toggle
PLG_J2COMMERCE_PAYMENT_PAYPAL_SUBSCRIPTION_MODE_LABEL="وضع إنشاء الاشتراك"
PLG_J2COMMERCE_PAYMENT_PAYPAL_SUBSCRIPTION_MODE_DESC="<strong>يتحكم في كيفية إنشاء الاشتراكات الجديدة عند الدفع.</strong> يتم توجيه عمليات التجديد دائمًا عبر metakey، لذا تظل الاشتراكات التي تم إنشاؤها في أي من الوضعين تعمل عند تغيير هذا المفتاح.<br><br><strong>REST الحديثة</strong> (الافتراضي): يستخدم العميل النافذة المنبثقة Smart Buttons → الجدول المتكرر من جانب PayPal → يقوم cron الخاص بالتطبيق بفرض الرسوم قسريًّا عبر /v1/billing/subscriptions/{id}/capture. يتم تخزينها كـ paypal_subscription_id metakey.<br><br><strong>NVP القديم</strong> (متوافق مع J2Store): تتم إعادة توجيه العميل إلى PayPal Express Checkout الكلاسيكي → يتم إرجاع BAID → يقوم cron الخاص بالتطبيق بفرض الرسوم عبر DoReferenceTransaction. يتم تخزينها كـ billing_agreement_id metakey. استخدم هذا عند الترحيل من J2Store بهدف أن تقوم أداة الترحيل لاحقًا بتحويل معرّفات BAID القديمة إلى قيم paypal_subscription_id الحديثة."
PLG_J2COMMERCE_PAYMENT_PAYPAL_SUBSCRIPTION_MODE_REST="واجهة برمجة تطبيقات الاشتراكات REST الحديثة (Smart Buttons)"
PLG_J2COMMERCE_PAYMENT_PAYPAL_SUBSCRIPTION_MODE_NVP="NVP القديم / Express Checkout (متوافق مع J2Store)"

; Configuration - NVP credentials (legacy J2Store BAID renewals — Path C hybrid)
PLG_J2COMMERCE_PAYMENT_PAYPAL_NVP_SECTION_LABEL="بيانات اعتماد واجهة برمجة تطبيقات NVP (لعمليات التجديد القديمة فقط)"
PLG_J2COMMERCE_PAYMENT_PAYPAL_NVP_SECTION_DESC="<strong>مطلوب فقط في حالة وجود اشتراكات J2Store تم ترحيلها (الصفوف في #__j2commerce_metafields التي تحتوي على metakey=billing_agreement_id).</strong> توقف PayPal عن إصدار بيانات اعتماد NVP للتجار الجدد في عام 2023 — إذا كنت تاجرًا جديدًا، فاترك هذه الحقول فارغة؛ حيث تستخدم الاشتراكات من الآن فصاعدًا تدفق REST الحديث. التجار الحاليون في J2Store: حددوا مواقع api_username وapi_password وapi_signature في PayPal → إعدادات الحساب → الوصول إلى الحساب → الوصول إلى واجهة برمجة التطبيقات → تكامل واجهة برمجة التطبيقات NVP/SOAP → إدارة بيانات اعتماد واجهة برمجة التطبيقات."
PLG_J2COMMERCE_PAYMENT_PAYPAL_NVP_API_USERNAME="اسم المستخدم لواجهة برمجة تطبيقات NVP (بيئة الإنتاج)"
