PLG_J2COMMERCE_PAYMENT_PAYPAL_NVP_API_PASSWORD_DESC="Produktions-NVP api_password från PayPal under ”Hantera API-autentiseringsuppgifter”."
PLG_J2COMMERCE_PAYMENT_PAYPAL_NVP_API_SIGNATURE="NVP API-signatur (produktion)"
PLG_J2COMMERCE_PAYMENT_PAYPAL_NVP_API_SIGNATURE_DESC="Produktions-NVP api_signature från PayPal under ”Hantera API-autentiseringsuppgifter”."
