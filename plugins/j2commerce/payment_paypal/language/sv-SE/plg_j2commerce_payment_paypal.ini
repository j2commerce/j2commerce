; Sandbox subscription test harness (admin-only, sandbox-mode-only)
PLG_J2COMMERCE_PAYMENT_PAYPAL_SANDBOX_TEST_LABEL="Testbänk för prenumerationer i sandbox"
PLG_J2COMMERCE_PAYMENT_PAYPAL_SANDBOX_TEST_DESC="<strong>1. Testa autentiseringsuppgifter</strong> — verifierar att sandboxens client_id och den hemliga nyckeln kan hämta ett giltigt OAuth-token.<br><strong>2. Skapa prenumeration</strong> — skapar en riktig katalogprodukt, en faktureringsplan ($1.00/day × 5 cykler) och en prenumeration i din sandbox. Returnerar en godkännande-URL — klicka på den, logga in med ett PERSONAL-konto i sandboxen och godkänn.<br><strong>3. Kontrollera status</strong> — klistra in prenumerations-ID:t I-XXXX och bekräfta att remote_status har ändrats till ACTIVE efter godkännandet.<br><strong>4. Avbryt</strong> — rensa bort testprenumerationen så att den inte fortsätter att debitera sandbox-kontot."
PLG_J2COMMERCE_PAYMENT_PAYPAL_SANDBOX_TEST_CREDS="1. Testa autentiseringsuppgifter"
PLG_J2COMMERCE_PAYMENT_PAYPAL_SANDBOX_TEST_CREATE="2. Skapa testprenumeration"
PLG_J2COMMERCE_PAYMENT_PAYPAL_SANDBOX_TEST_CHECK="3. Kontrollera status"
PLG_J2COMMERCE_PAYMENT_PAYPAL_SANDBOX_TEST_CANCEL="4. Avbryt testprenumeration"
PLG_J2COMMERCE_PAYMENT_PAYPAL_SANDBOX_TEST_NVP="5. Testa NVP-autentiseringsuppgifter"
PLG_J2COMMERCE_PAYMENT_PAYPAL_SANDBOX_TEST_SUBID_LABEL="PayPal-prenumerations-ID"
PLG_J2COMMERCE_PAYMENT_PAYPAL_SANDBOX_TEST_SUBID_HELP="Fylls i automatiskt efter steg 2. Används av ”Kontrollera status” / ”Avbryt”."

