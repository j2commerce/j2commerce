; Configuration - Subscription mode toggle
PLG_J2COMMERCE_PAYMENT_PAYPAL_SUBSCRIPTION_MODE_LABEL="Läge för skapande av prenumerationer"
PLG_J2COMMERCE_PAYMENT_PAYPAL_SUBSCRIPTION_MODE_DESC="<strong>Styr hur NYA prenumerationer skapas vid utcheckningen.</strong> Förnyelser dirigeras alltid via metakey, så prenumerationer som skapats i något av lägena fortsätter att fungera när denna inställning ändras.<br><br><strong>Modern REST</strong> (standard): kunden använder popup-fönstret Smart Buttons → återkommande betalningsschema på PayPal-sidan → appen tvingar fram debiteringar via /v1/billing/subscriptions/{id}/capture. Lagras som paypal_subscription_id metakey.<br><br><strong>Äldre NVP</strong> (kompatibelt med J2Store): kunden omdirigeras till klassisk PayPal Express Checkout → BAID returneras → appens cron debiterar via DoReferenceTransaction. Lagras som billing_agreement_id metakey. Använd detta vid migrering från J2Store med avsikten att ett migreringsverktyg senare ska konvertera äldre BAID:er till moderna paypal_subscription_id-värden."
PLG_J2COMMERCE_PAYMENT_PAYPAL_SUBSCRIPTION_MODE_REST="Modernt REST-prenumerations-API (Smart Buttons)"
PLG_J2COMMERCE_PAYMENT_PAYPAL_SUBSCRIPTION_MODE_NVP="Äldre NVP / Express Checkout (J2Store-kompatibelt)"

; Configuration - NVP credentials (legacy J2Store BAID renewals — Path C hybrid)
PLG_J2COMMERCE_PAYMENT_PAYPAL_NVP_SECTION_LABEL="NVP API-autentiseringsuppgifter (endast förnyelser av äldre prenumerationer)"
PLG_J2COMMERCE_PAYMENT_PAYPAL_NVP_SECTION_DESC="<strong>Krävs ENDAST när migrerade J2Store-prenumerationer finns (rader i #__j2commerce_metafields där metakey=billing_agreement_id).</strong> PayPal slutade utfärda NVP-autentiseringsuppgifter till nya handlare år 2023 – om du är en ny handlare ska du lämna dessa fält tomma; prenumerationer från och med nu använder det moderna REST-flödet. Befintliga J2Store-handlare: hitta api_username, api_password och api_signature i PayPal → Kontoinställningar → Kontoåtkomst → API-åtkomst → NVP/SOAP API-integration → Hantera API-autentiseringsuppgifter."
PLG_J2COMMERCE_PAYMENT_PAYPAL_NVP_API_USERNAME="NVP API-användarnamn (produktion)"
PLG_J2COMMERCE_PAYMENT_PAYPAL_NVP_API_USERNAME_DESC="Produktions-NVP api_username från PayPal under ”Hantera API-autentiseringsuppgifter”."
