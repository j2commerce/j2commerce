PLG_J2COMMERCE_PAYMENT_PAYPAL_NVP_API_PASSWORD_DESC="PayPal の「API 認証情報の管理」にある本番環境用 NVP api_password。"
PLG_J2COMMERCE_PAYMENT_PAYPAL_NVP_API_SIGNATURE="NVP API 署名（本番環境）"
