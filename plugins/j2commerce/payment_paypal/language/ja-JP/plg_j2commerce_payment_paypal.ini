; Configuration - Subscription mode toggle
PLG_J2COMMERCE_PAYMENT_PAYPAL_SUBSCRIPTION_MODE_LABEL="サブスクリプション作成モード"
PLG_J2COMMERCE_PAYMENT_PAYPAL_SUBSCRIPTION_MODE_DESC="<strong>チェックアウト時に新しいサブスクリプションがどのように作成されるかを制御します。</strong> 更新は常に metakey 経由で行われるため、どちらのモードで作成されたサブスクリプションも、この切り替えを変更しても引き続き機能します。<br><br><strong>モダン REST</strong>（デフォルト）：顧客がスマートボタンのポップアップを使用 → PayPal 側の定期支払いスケジュール → アプリが /v1/billing/subscriptions/{id}/capture 経由で cron による強制課金を行います。paypal_subscription_id metakey として保存されます。<br><br><strong>レガシー NVP</strong>（J2Store 互換）：顧客が従来の PayPal Express Checkout にリダイレクト → BAID が返される → アプリの cron が DoReferenceTransaction 経由で課金を行います。billing_agreement_id metakey として保存されます。J2Store からの移行時に、移行ツールが後でレガシー BAID をモダンな paypal_subscription_id 値に変換することを想定して、こちらをご利用ください。"
PLG_J2COMMERCE_PAYMENT_PAYPAL_SUBSCRIPTION_MODE_REST="モダン REST サブスクリプション API（Smart Buttons）"
PLG_J2COMMERCE_PAYMENT_PAYPAL_SUBSCRIPTION_MODE_NVP="レガシー NVP / Express Checkout（J2Store 互換）"

; Configuration - NVP credentials (legacy J2Store BAID renewals — Path C hybrid)
PLG_J2COMMERCE_PAYMENT_PAYPAL_NVP_SECTION_LABEL="NVP API 認証情報（レガシーの更新のみ）"
PLG_J2COMMERCE_PAYMENT_PAYPAL_NVP_SECTION_DESC="<strong>J2Store から移行されたサブスクリプションが存在する場合にのみ必須です（#__j2commerce_metafields 内の行で、metakey=billing_agreement_id となるもの）。</strong> PayPal は 2023 年より、新規加盟店への NVP 認証情報の発行を停止しました。新規加盟店の場合は、これらの欄を空白のままにしてください。これ以降に作成されるサブスクリプションでは、最新の REST フローが使用されます。既存の J2Store 加盟店様：PayPal の「アカウント設定」→「アカウントへのアクセス」→「API へのアクセス」→「NVP/SOAP API 連携」→「API 認証情報の管理」にて、api_username、api_password、および api_signature をご確認ください。"
PLG_J2COMMERCE_PAYMENT_PAYPAL_NVP_API_USERNAME="NVP API ユーザー名（本番環境）"
PLG_J2COMMERCE_PAYMENT_PAYPAL_NVP_API_USERNAME_DESC="PayPal の「API 認証情報の管理」にある本番環境用 NVP api_username。"
