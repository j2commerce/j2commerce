; Sandbox subscription test harness (admin-only, sandbox-mode-only)
PLG_J2COMMERCE_PAYMENT_PAYPAL_SANDBOX_TEST_LABEL="サンドボックス サブスクリプション テストツール"
PLG_J2COMMERCE_PAYMENT_PAYPAL_SANDBOX_TEST_DESC="<strong>1. 認証情報のテスト</strong> — サンドボックスの client_id とシークレットが有効な OAuth トークンを取得できるかを確認します。<br><strong>2. サブスクリプションの作成</strong> — サンドボックス内に実際のカタログ商品、課金プラン（$1.00/day × 5 サイクル）、およびサブスクリプションを作成します。承認用 URL が返されます — それをクリックし、サンドボックスの PERSONAL アカウントでログインして、承認してください。<br><strong>3. ステータスの確認</strong> — I-XXXX のサブスクリプション ID を貼り付け、承認後に remote_status が ACTIVE に変わっていることを確認してください。<br><strong>4. キャンセル</strong> — サンドボックスアカウントへの請求が続かないよう、テストサブスクリプションを削除します。"
PLG_J2COMMERCE_PAYMENT_PAYPAL_SANDBOX_TEST_CREDS="1. 認証情報のテスト"
