; Sandbox subscription test harness (admin-only, sandbox-mode-only)
PLG_J2COMMERCE_PAYMENT_PAYPAL_SANDBOX_TEST_LABEL="Tilausten testialusta sandbox-ympäristössä"
PLG_J2COMMERCE_PAYMENT_PAYPAL_SANDBOX_TEST_DESC="<strong>1. Testaa tunnistetiedot</strong> — tarkistaa, että sandboxin client_id ja salainen avain hankkivat kelvollisen OAuth-tunnuksen.<br><strong>2. Luo tilaus</strong> — luo todellisen tuoteluettelotuotteen, laskutussuunnitelman ($1.00/day × 5 jaksoa) ja tilauksen sandbox-ympäristössäsi. Palauttaa hyväksymis-URL:n — napsauta sitä, kirjaudu sisään sandboxin PERSONAL-tilillä ja hyväksy.<br><strong>3. Tarkista tila</strong> — liitä tilaustunnus I-XXXX ja varmista, että remote_status on muuttunut ACTIVE:ksi hyväksynnän jälkeen.<br><strong>4. Peruuta</strong> — poista testitilaus, jotta se ei jatka laskutusta sandbox-tililtä."
PLG_J2COMMERCE_PAYMENT_PAYPAL_SANDBOX_TEST_CREDS="1. Testaa tunnistetiedot"
PLG_J2COMMERCE_PAYMENT_PAYPAL_SANDBOX_TEST_CREATE="2. Luo testitilaus"
PLG_J2COMMERCE_PAYMENT_PAYPAL_SANDBOX_TEST_CHECK="3. Tarkista tila"
PLG_J2COMMERCE_PAYMENT_PAYPAL_SANDBOX_TEST_CANCEL="4. Peruuta testitilaus"
PLG_J2COMMERCE_PAYMENT_PAYPAL_SANDBOX_TEST_NVP="5. Testaa NVP-tunnistetiedot"
