PLG_J2COMMERCE_PAYMENT_PAYPAL_SANDBOX_TEST_SUBID_HELP="Täytetään automaattisesti vaiheen 2 jälkeen. Käytetään toiminnoissa ”Tarkista tila” / ”Peruuta”."

