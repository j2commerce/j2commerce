; Configuration - Subscription mode toggle
PLG_J2COMMERCE_PAYMENT_PAYPAL_SUBSCRIPTION_MODE_LABEL="Tilauksen luontitila"
PLG_J2COMMERCE_PAYMENT_PAYPAL_SUBSCRIPTION_MODE_DESC="<strong>Määrittää, miten UUDET tilaukset luodaan kassalla.</strong> Uusinnat reititetään aina metakey:n kautta, joten kummassakin tilassa luodut tilaukset toimivat edelleen, kun tätä kytkintä muutetaan.<br><br><strong>Nykyaikainen REST</strong> (oletus): asiakas käyttää Smart Buttons -ponnahdusikkunaa → PayPal-puolen toistuva veloitusaikataulu → sovelluksen cron veloittaa pakotetusti /v1/billing/subscriptions/{id}/capture:n kautta. Tallennetaan muodossa paypal_subscription_id metakey.<br><br><strong>Vanha NVP</strong> (J2Store-yhteensopiva): asiakas ohjataan klassiseen PayPal Express Checkout -kassalle → BAID palautetaan → sovelluksen cron veloittaa DoReferenceTransaction:n kautta. Tallennetaan muodossa billing_agreement_id metakey. Käytä tätä siirryttäessä J2Store-alustalta, jos siirtotyökalu muuntaa myöhemmin vanhat BAID-tunnukset nykyaikaisiksi paypal_subscription_id-arvoiksi."
PLG_J2COMMERCE_PAYMENT_PAYPAL_SUBSCRIPTION_MODE_REST="Nykyaikainen REST-tilausrajapinta (Smart Buttons)"
PLG_J2COMMERCE_PAYMENT_PAYPAL_SUBSCRIPTION_MODE_NVP="Vanha NVP / Express Checkout (J2Store-yhteensopiva)"

; Configuration - NVP credentials (legacy J2Store BAID renewals — Path C hybrid)
PLG_J2COMMERCE_PAYMENT_PAYPAL_NVP_SECTION_LABEL="NVP-rajapinnan tunnistetiedot (vain vanhojen tilausten uusimiset)"
PLG_J2COMMERCE_PAYMENT_PAYPAL_NVP_SECTION_DESC="<strong>Vaaditaan AINOASTAAN, kun siirrettyjä J2Store-tilauksia on olemassa (#__j2commerce_metafields:n rivit, joissa metakey=billing_agreement_id).</strong> PayPal lopetti NVP-tunnistetietojen myöntämisen uusille kauppiaille vuonna 2023 – jos olet uusi kauppias, jätä nämä kentät tyhjiksi; tästä lähtien tilaukset käyttävät nykyaikaista REST-prosessia. Nykyiset J2Store-kauppiaat: etsi api_username, api_password ja api_signature kohdasta PayPal → Tilin asetukset → Tilin käyttöoikeudet → API-käyttöoikeudet → NVP/SOAP-API-integraatio → Hallinnoi API-tunnistetietoja."
PLG_J2COMMERCE_PAYMENT_PAYPAL_NVP_API_USERNAME="NVP-API-käyttäjätunnus (tuotantoympäristö)"
