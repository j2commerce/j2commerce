PLG_J2COMMERCE_PAYMENT_PAYPAL_NVP_API_PASSWORD_DESC="Tuotantoympäristön NVP api_password PayPalin kohdasta ”Hallinnoi API-tunnistetietoja”."
PLG_J2COMMERCE_PAYMENT_PAYPAL_NVP_API_SIGNATURE="NVP-API-allekirjoitus (tuotantoympäristö)"
PLG_J2COMMERCE_PAYMENT_PAYPAL_NVP_API_SIGNATURE_DESC="Tuotantoympäristön NVP api_signature PayPalin kohdasta ”Hallinnoi API-tunnistetietoja”."
PLG_J2COMMERCE_PAYMENT_PAYPAL_NVP_SANDBOX_API_USERNAME="NVP-API-käyttäjätunnus (sandbox)"
PLG_J2COMMERCE_PAYMENT_PAYPAL_NVP_SANDBOX_API_USERNAME_DESC="Sandbox-NVP api_username vanhojen BAID-uusintojen testaamiseen."
