; Sandbox subscription test harness (admin-only, sandbox-mode-only)
PLG_J2COMMERCE_PAYMENT_PAYPAL_SANDBOX_TEST_LABEL="Sandbox-Abonnement-Testumgebung"
PLG_J2COMMERCE_PAYMENT_PAYPAL_SANDBOX_TEST_DESC="<strong>1. Anmeldedaten testen</strong> – überprüft, ob Sandbox-client_id und Secret ein gültiges OAuth-Token erhalten.<br><strong>2. Abonnement erstellen</strong> – erstellt ein echtes Katalogprodukt, einen Abrechnungsplan ($1.00/day × 5 Zyklen) und ein Abonnement in Ihrer Sandbox. Gibt eine Genehmigungs-URL zurück – klicken Sie darauf, melden Sie sich mit einem PERSÖNLICHEN Sandbox-Konto an und genehmigen Sie.<br><strong>3. Status prüfen</strong> – fügen Sie die I-XXXX-Abonnement-ID ein und vergewissern Sie sich, dass remote_status nach der Genehmigung auf ACTIVE umgeschaltet wurde.<br><strong>4. Kündigen</strong> – löschen Sie das Testabonnement, damit das Sandbox-Konto nicht weiterhin belastet wird."
PLG_J2COMMERCE_PAYMENT_PAYPAL_SANDBOX_TEST_CREDS="1. Anmeldedaten testen"
PLG_J2COMMERCE_PAYMENT_PAYPAL_SANDBOX_TEST_CREATE="2. Testabonnement erstellen"
PLG_J2COMMERCE_PAYMENT_PAYPAL_SANDBOX_TEST_CHECK="3. Status prüfen"
PLG_J2COMMERCE_PAYMENT_PAYPAL_SANDBOX_TEST_CANCEL="4. Testabonnement kündigen"
PLG_J2COMMERCE_PAYMENT_PAYPAL_SANDBOX_TEST_NVP="5. NVP-Anmeldedaten testen"
PLG_J2COMMERCE_PAYMENT_PAYPAL_SANDBOX_TEST_SUBID_LABEL="PayPal-Abonnement-ID"
PLG_J2COMMERCE_PAYMENT_PAYPAL_SANDBOX_TEST_SUBID_HELP="Wird nach Schritt 2 automatisch ausgefüllt. Wird von „Status prüfen“ / „Kündigen“ verwendet."

