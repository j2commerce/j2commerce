PLG_J2COMMERCE_PAYMENT_PAYPAL_NVP_API_PASSWORD_DESC="Live-NVP api_password aus PayPal „API-Zugangsdaten verwalten“."
PLG_J2COMMERCE_PAYMENT_PAYPAL_NVP_API_SIGNATURE="NVP-API-Signatur (Live)"
PLG_J2COMMERCE_PAYMENT_PAYPAL_NVP_API_SIGNATURE_DESC="Live-NVP api_signature aus PayPal „API-Zugangsdaten verwalten“."
