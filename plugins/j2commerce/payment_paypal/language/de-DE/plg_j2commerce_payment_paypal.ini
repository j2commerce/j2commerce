PLG_J2COMMERCE_PAYMENT_PAYPAL_PENDING_STATUS="Status „Ausstehende Erfassung der Bestellung“"
PLG_J2COMMERCE_PAYMENT_PAYPAL_PENDING_STATUS_DESC="Bestellstatus, der geschrieben wird, wenn PayPal eine Erfassung als „ausstehend“ meldet. Lassen Sie das Feld leer, um den als „Offen“ zugeordneten Status oder den Kernstatus „Ausstehend“ zu verwenden."
PLG_J2COMMERCE_PAYMENT_PAYPAL_FAILED_STATUS="Status „Fehlgeschlagene Zahlungsanweisung“"
PLG_J2COMMERCE_PAYMENT_PAYPAL_FAILED_STATUS_DESC="Bestellstatus, der geschrieben wird, wenn PayPal eine Einziehung ablehnt oder rückgängig macht. Lassen Sie das Feld leer, um den als „Failed“ zugeordneten Status oder den Kernstatus „Failed“ zu verwenden."
PLG_J2COMMERCE_PAYMENT_PAYPAL_REFUNDED_STATUS="Status „Rückerstattung“"
PLG_J2COMMERCE_PAYMENT_PAYPAL_REFUNDED_STATUS_DESC="Bestellstatus, der bei einer Rückerstattung einer Zahlung geschrieben wird, sei es über die Rückerstattungsschaltfläche im Admin-Bereich oder einen PayPal-Webhook. Lassen Sie das Feld leer, um den als „Rückerstattet“ zugeordneten Status zu verwenden; ist kein Status zugeordnet, bleibt der Status unverändert."
