; Configuration - Subscription mode toggle
PLG_J2COMMERCE_PAYMENT_PAYPAL_SUBSCRIPTION_MODE_LABEL="Modus zur Erstellung von Abonnements"
PLG_J2COMMERCE_PAYMENT_PAYPAL_SUBSCRIPTION_MODE_DESC="<strong>Steuert, wie NEUE Abonnements an der Kasse erstellt werden.</strong> Verlängerungen werden immer über metakey weitergeleitet, sodass Abonnements, die in einem der beiden Modi erstellt wurden, weiterhin funktionieren, wenn diese Umschaltfunktion geändert wird.<br><br><strong>Modernes REST</strong> (Standard): Der Kunde nutzt das Popup „Smart Buttons“ → PayPal-seitiger Wiederholungsplan → Die App führt über /v1/billing/subscriptions/{id}/capture eine Cron-Zwangsabbuchung durch. Gespeichert als paypal_subscription_id metakey.<br><br><strong>Legacy-NVP</strong> (J2Store-kompatibel): Der Kunde wird zum klassischen PayPal Express Checkout weitergeleitet → BAID wird zurückgegeben → Die App führt über DoReferenceTransaction eine Cron-Abrechnung durch. Gespeichert als billing_agreement_id metakey. Verwenden Sie diese Option bei der Migration aus J2Store mit der Absicht, dass ein Migrationstool später die alten BAIDs in moderne paypal_subscription_id-Werte konvertiert."
PLG_J2COMMERCE_PAYMENT_PAYPAL_SUBSCRIPTION_MODE_REST="Moderne REST-Abonnement-API (Smart Buttons)"
PLG_J2COMMERCE_PAYMENT_PAYPAL_SUBSCRIPTION_MODE_NVP="Legacy-NVP / Express Checkout (J2Store-kompatibel)"

; Configuration - NVP credentials (legacy J2Store BAID renewals — Path C hybrid)
PLG_J2COMMERCE_PAYMENT_PAYPAL_NVP_SECTION_LABEL="NVP-API-Anmeldedaten (nur für Legacy-Verlängerungen)"
PLG_J2COMMERCE_PAYMENT_PAYPAL_NVP_SECTION_DESC="<strong>Nur erforderlich, wenn migrierte J2Store-Abonnements vorhanden sind (Zeilen in #__j2commerce_metafields mit metakey=billing_agreement_id).</strong> PayPal hat im Jahr 2023 die Vergabe von NVP-Zugangsdaten an neue Händler eingestellt – sollten Sie ein neuer Händler sein, lassen Sie diese Felder leer; Abonnements ab diesem Zeitpunkt nutzen den modernen REST-Ablauf. Bestehende J2Store-Händler: Suchen Sie api_username, api_password und api_signature unter PayPal → Kontoeinstellungen → Kontozugriff → API-Zugriff → NVP/SOAP-API-Integration → API-Zugangsdaten verwalten."
PLG_J2COMMERCE_PAYMENT_PAYPAL_NVP_API_USERNAME="NVP-API-Benutzername (Live)"
PLG_J2COMMERCE_PAYMENT_PAYPAL_NVP_API_USERNAME_DESC="Live-NVP api_username aus PayPal „API-Zugangsdaten verwalten“."
