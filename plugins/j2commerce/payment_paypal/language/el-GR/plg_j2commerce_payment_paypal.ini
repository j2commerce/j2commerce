; Configuration - Subscription mode toggle
PLG_J2COMMERCE_PAYMENT_PAYPAL_SUBSCRIPTION_MODE_LABEL="Λειτουργία δημιουργίας συνδρομής"
PLG_J2COMMERCE_PAYMENT_PAYPAL_SUBSCRIPTION_MODE_DESC="<strong>Ελέγχει τον τρόπο δημιουργίας ΝΕΩΝ συνδρομών κατά την ολοκλήρωση της αγοράς.</strong> Οι ανανεώσεις δρομολογούνται πάντα μέσω του metakey, οπότε οι συνδρομές που δημιουργήθηκαν σε οποιαδήποτε από τις δύο λειτουργίες συνεχίζουν να λειτουργούν όταν αλλάζει αυτή η ρύθμιση.<br><br><strong>Σύγχρονο REST</strong> (προεπιλογή): ο πελάτης χρησιμοποιεί το αναδυόμενο παράθυρο των Smart Buttons → πρόγραμμα επαναλαμβανόμενων πληρωμών από την πλευρά του PayPal → η εφαρμογή πραγματοποιεί αναγκαστικές χρεώσεις μέσω /v1/billing/subscriptions/{id}/capture. Αποθηκεύεται ως paypal_subscription_id metakey.<br><br><strong>Παλαιό NVP</strong> (συμβατό με J2Store): ο πελάτης ανακατευθύνεται στο κλασικό PayPal Express Checkout → επιστρέφεται το BAID → η εφαρμογή χρεώνει μέσω cron μέσω του DoReferenceTransaction. Αποθηκεύεται ως billing_agreement_id metakey. Χρησιμοποιήστε αυτό κατά τη μετεγκατάσταση από το J2Store με την πρόθεση να μετατρέψει αργότερα ένα εργαλείο μετεγκατάστασης τα παλαιά BAID σε σύγχρονες τιμές paypal_subscription_id."
PLG_J2COMMERCE_PAYMENT_PAYPAL_SUBSCRIPTION_MODE_REST="Σύγχρονο REST Subscriptions API (Smart Buttons)"
PLG_J2COMMERCE_PAYMENT_PAYPAL_SUBSCRIPTION_MODE_NVP="Παλαιό NVP / Express Checkout (συμβατό με το J2Store)"

; Configuration - NVP credentials (legacy J2Store BAID renewals — Path C hybrid)
PLG_J2COMMERCE_PAYMENT_PAYPAL_NVP_SECTION_LABEL="Διαπιστευτήρια API NVP (μόνο για ανανεώσεις παλαιών συνδρομών)"
PLG_J2COMMERCE_PAYMENT_PAYPAL_NVP_SECTION_DESC="<strong>Απαιτείται ΜΟΝΟ όταν υπάρχουν μεταφερθείσες συνδρομές από το J2Store (γραμμές στο #__j2commerce_metafields με metakey=billing_agreement_id).</strong> Η PayPal σταμάτησε να εκδίδει διαπιστευτήρια NVP σε νέους εμπόρους το 2023 — εάν είστε νέος έμπορος, αφήστε αυτά τα πεδία κενά· οι συνδρομές από εδώ και στο εξής χρησιμοποιούν τη σύγχρονη ροή REST. Υπάρχοντες έμποροι J2Store: εντοπίστε τα api_username, api_password και api_signature στο PayPal → Ρυθμίσεις λογαριασμού → Πρόσβαση στον λογαριασμό → Πρόσβαση στο API → Ενσωμάτωση API NVP/SOAP → Διαχείριση διαπιστευτηρίων API."
PLG_J2COMMERCE_PAYMENT_PAYPAL_NVP_API_USERNAME="Όνομα χρήστη API NVP (παραγωγή)"
PLG_J2COMMERCE_PAYMENT_PAYPAL_NVP_API_USERNAME_DESC="NVP παραγωγής api_username από τη «Διαχείριση διαπιστευτηρίων API» του PayPal."
PLG_J2COMMERCE_PAYMENT_PAYPAL_NVP_API_PASSWORD="Κωδικός πρόσβασης API NVP (παραγωγή)"
PLG_J2COMMERCE_PAYMENT_PAYPAL_NVP_API_PASSWORD_DESC="NVP παραγωγής api_password από τη «Διαχείριση διαπιστευτηρίων API» του PayPal."
PLG_J2COMMERCE_PAYMENT_PAYPAL_NVP_API_SIGNATURE="Υπογραφή API NVP (παραγωγή)"
PLG_J2COMMERCE_PAYMENT_PAYPAL_NVP_API_SIGNATURE_DESC="NVP παραγωγής api_signature από τη «Διαχείριση διαπιστευτηρίων API» του PayPal."
PLG_J2COMMERCE_PAYMENT_PAYPAL_NVP_SANDBOX_API_USERNAME="Όνομα χρήστη API NVP (sandbox)"
PLG_J2COMMERCE_PAYMENT_PAYPAL_NVP_SANDBOX_API_USERNAME_DESC="NVP sandbox api_username για τη δοκιμή ανανεώσεων παλαιού τύπου BAID."
PLG_J2COMMERCE_PAYMENT_PAYPAL_NVP_SANDBOX_API_PASSWORD="Κωδικός πρόσβασης API NVP (sandbox)"
