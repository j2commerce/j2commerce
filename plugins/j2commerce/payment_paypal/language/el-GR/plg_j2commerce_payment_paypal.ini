; Sandbox subscription test harness (admin-only, sandbox-mode-only)
PLG_J2COMMERCE_PAYMENT_PAYPAL_SANDBOX_TEST_LABEL="Πλατφόρμα δοκιμών συνδρομών σε sandbox"
PLG_J2COMMERCE_PAYMENT_PAYPAL_SANDBOX_TEST_DESC="<strong>1. Δοκιμή διαπιστευτηρίων</strong> — επαληθεύει ότι το client_id του sandbox και το μυστικό κλειδί λαμβάνουν έγκυρο διακριτικό OAuth.<br><strong>2. Δημιουργία συνδρομής</strong> — δημιουργεί ένα πραγματικό προϊόν καταλόγου, πρόγραμμα χρέωσης ($1.00/day × 5 κύκλοι) και συνδρομή στο sandbox σας. Επιστρέφει μια διεύθυνση URL έγκρισης — κάντε κλικ σε αυτήν, συνδεθείτε με έναν ΠΡΟΣΩΠΙΚΟ λογαριασμό στο sandbox και εγκρίνετε.<br><strong>3. Έλεγχος κατάστασης</strong> — επικολλήστε το αναγνωριστικό συνδρομής I-XXXX και επιβεβαιώστε ότι το remote_status έχει αλλάξει σε ACTIVE μετά την έγκριση.<br><strong>4. Ακύρωση</strong> — διαγράψτε τη δοκιμαστική συνδρομή, ώστε να μην συνεχίσει να χρεώνει τον λογαριασμό του sandbox."
PLG_J2COMMERCE_PAYMENT_PAYPAL_SANDBOX_TEST_CREDS="1. Δοκιμή διαπιστευτηρίων"
PLG_J2COMMERCE_PAYMENT_PAYPAL_SANDBOX_TEST_CREATE="2. Δημιουργία δοκιμαστικής συνδρομής"
PLG_J2COMMERCE_PAYMENT_PAYPAL_SANDBOX_TEST_CHECK="3. Έλεγχος κατάστασης"
PLG_J2COMMERCE_PAYMENT_PAYPAL_SANDBOX_TEST_CANCEL="4. Ακύρωση δοκιμαστικής συνδρομής"
PLG_J2COMMERCE_PAYMENT_PAYPAL_SANDBOX_TEST_NVP="5. Δοκιμή διαπιστευτηρίων NVP"
PLG_J2COMMERCE_PAYMENT_PAYPAL_SANDBOX_TEST_SUBID_LABEL="Αναγνωριστικό συνδρομής PayPal"
