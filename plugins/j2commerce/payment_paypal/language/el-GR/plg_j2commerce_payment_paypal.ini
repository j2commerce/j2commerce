PLG_J2COMMERCE_PAYMENT_PAYPAL_PENDING_STATUS_DESC="Κατάσταση παραγγελίας που καταγράφεται όταν το PayPal αναφέρει μια συναλλαγή ως εκκρεμή. Αφήστε το πεδίο κενό για να χρησιμοποιήσετε την κατάσταση που αντιστοιχεί ως «Ανοιχτή» ή την βασική κατάσταση «Εκκρεμής»."
PLG_J2COMMERCE_PAYMENT_PAYPAL_FAILED_STATUS="Κατάσταση παραγγελίας με αποτυχημένη πληρωμή"
PLG_J2COMMERCE_PAYMENT_PAYPAL_FAILED_STATUS_DESC="Κατάσταση παραγγελίας που αναγράφεται όταν το PayPal απορρίπτει ή ακυρώνει μια καταχώριση. Αφήστε το κενό για να χρησιμοποιήσετε την κατάσταση που αντιστοιχεί ως «Αποτυχία» ή την βασική κατάσταση «Αποτυχία»."
PLG_J2COMMERCE_PAYMENT_PAYPAL_REFUNDED_STATUS="Κατάσταση παραγγελίας με επιστροφή χρημάτων"
PLG_J2COMMERCE_PAYMENT_PAYPAL_REFUNDED_STATUS_DESC="Κατάσταση παραγγελίας που καταγράφεται όταν μια συναλλαγή επιστρέφεται, είτε από το κουμπί επιστροφής χρημάτων του διαχειριστή είτε από ένα webhook του PayPal. Αφήστε το πεδίο κενό για να χρησιμοποιηθεί η κατάσταση που έχει αντιστοιχιστεί ως «Επιστράφηκε»· εάν δεν έχει αντιστοιχιστεί καμία, η κατάσταση παραμένει αμετάβλητη."
