; Configuration - Subscription mode toggle
PLG_J2COMMERCE_PAYMENT_PAYPAL_SUBSCRIPTION_MODE_LABEL="Abonelik oluşturma modu"
PLG_J2COMMERCE_PAYMENT_PAYPAL_SUBSCRIPTION_MODE_DESC="<strong>Ödeme sırasında YENİ aboneliklerin nasıl oluşturulacağını kontrol eder.</strong> Yenilemeler her zaman metakey üzerinden yönlendirilir; bu nedenle, bu anahtar değiştirildiğinde her iki modda oluşturulan abonelikler çalışmaya devam eder.<br><br><strong>Modern REST</strong> (varsayılan): müşteri Smart Buttons açılır penceresini kullanır → PayPal tarafında tekrarlayan ödeme planı → uygulamanın cron görevi /v1/billing/subscriptions/{id}/capture aracılığıyla zorla ödeme alır. paypal_subscription_id metakey olarak saklanır.<br><br><strong>Eski NVP</strong> (J2Store uyumlu): müşteri klasik PayPal Express Checkout sayfasına yönlendirilir → BAID döndürülür → uygulamanın cron görevi DoReferenceTransaction aracılığıyla ücretlendirme yapar. billing_agreement_id metakey olarak saklanır. J2Store’dan geçiş yaparken, bir geçiş aracının daha sonra eski BAID değerlerini modern paypal_subscription_id değerlerine dönüştüreceği düşünülüyorsa bunu kullanın."
PLG_J2COMMERCE_PAYMENT_PAYPAL_SUBSCRIPTION_MODE_REST="Modern REST Abonelik API’si (Smart Buttons)"
PLG_J2COMMERCE_PAYMENT_PAYPAL_SUBSCRIPTION_MODE_NVP="Eski NVP / Express Checkout (J2Store uyumlu)"

; Configuration - NVP credentials (legacy J2Store BAID renewals — Path C hybrid)
PLG_J2COMMERCE_PAYMENT_PAYPAL_NVP_SECTION_LABEL="NVP API Kimlik Bilgileri (yalnızca eski yenilemeler için)"
PLG_J2COMMERCE_PAYMENT_PAYPAL_NVP_SECTION_DESC="<strong>YALNIZCA taşınmış J2Store abonelikleri mevcut olduğunda gereklidir (#__j2commerce_metafields tablosunda metakey=billing_agreement_id olan satırlar).</strong> PayPal, 2023 yılında yeni satıcılara NVP kimlik bilgileri vermeyi durdurmuştur — yeni bir satıcıysanız, bu alanları boş bırakın; bu tarihten itibaren abonelikler modern REST akışını kullanır. Mevcut J2Store satıcıları: PayPal → Hesap Ayarları → Hesap erişimi → API erişimi → NVP/SOAP API entegrasyonu → API kimlik bilgilerini yönet bölümünde api_username, api_password ve api_signature öğelerini bulun."
