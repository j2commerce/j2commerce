; Sandbox subscription test harness (admin-only, sandbox-mode-only)
PLG_J2COMMERCE_PAYMENT_PAYPAL_SANDBOX_TEST_LABEL="Sandbox abonelik test ortamı"
PLG_J2COMMERCE_PAYMENT_PAYPAL_SANDBOX_TEST_DESC="<strong>1. Kimlik Bilgilerini Test Et</strong> — sandbox client_id ve gizli anahtarının geçerli bir OAuth belirteci aldığını doğrular.<br><strong>2. Abonelik Oluştur</strong> — sandbox ortamınızda gerçek bir katalog ürünü, faturalandırma planı ($1.00/day × 5 döngü) ve abonelik oluşturur. Bir Onay URL’si döndürür — üzerine tıklayın, sandbox KİŞİSEL hesabınızla oturum açın ve onaylayın.<br><strong>3. Durumu Kontrol Et</strong> — I-XXXX abonelik kimliğini yapıştırın ve onaylandıktan sonra remote_status değerinin ACTIVE olarak değiştiğini doğrulayın.<br><strong>4. İptal Et</strong> — sandbox hesabından faturalandırma yapılmaya devam etmemesi için test aboneliğini temizleyin."
PLG_J2COMMERCE_PAYMENT_PAYPAL_SANDBOX_TEST_CREDS="1. Kimlik Bilgilerini Test Et"
PLG_J2COMMERCE_PAYMENT_PAYPAL_SANDBOX_TEST_CREATE="2. Test Aboneliği Oluştur"
PLG_J2COMMERCE_PAYMENT_PAYPAL_SANDBOX_TEST_CHECK="3. Durumu Kontrol Et"
PLG_J2COMMERCE_PAYMENT_PAYPAL_SANDBOX_TEST_CANCEL="4. Test Aboneliğini İptal Et"
PLG_J2COMMERCE_PAYMENT_PAYPAL_SANDBOX_TEST_NVP="5. NVP Kimlik Bilgilerini Test Et"
PLG_J2COMMERCE_PAYMENT_PAYPAL_SANDBOX_TEST_SUBID_LABEL="PayPal Abonelik Kimliği"
PLG_J2COMMERCE_PAYMENT_PAYPAL_SANDBOX_TEST_SUBID_HELP="2. adımdan sonra otomatik olarak doldurulur. “Durumu Kontrol Et” / “İptal Et” işlemleri tarafından kullanılır."

