; Sandbox subscription test harness (admin-only, sandbox-mode-only)
PLG_J2COMMERCE_PAYMENT_PAYPAL_SANDBOX_TEST_LABEL="Banco de testes de subscrições em sandbox"
PLG_J2COMMERCE_PAYMENT_PAYPAL_SANDBOX_TEST_DESC="<strong>1. Testar credenciais</strong> — verifica se o client_id de sandbox e o segredo obtêm um token OAuth válido.<br><strong>2. Criar subscrição</strong> — cria um produto real do catálogo, um plano de faturação ($1.00/day × 5 ciclos) e uma subscrição na sua sandbox. Devolve um URL de aprovação — clique nele, inicie sessão com uma conta PERSONAL da sandbox e aprove.<br><strong>3. Verificar estado</strong> — cole o ID da subscrição I-XXXX e confirme se remote_status mudou para ACTIVE após a aprovação.<br><strong>4. Cancelar</strong> — elimine a subscrição de teste para que não continue a cobrar à conta da sandbox."
PLG_J2COMMERCE_PAYMENT_PAYPAL_SANDBOX_TEST_CREDS="1. Testar credenciais"
PLG_J2COMMERCE_PAYMENT_PAYPAL_SANDBOX_TEST_CREATE="2. Criar subscrição de teste"
PLG_J2COMMERCE_PAYMENT_PAYPAL_SANDBOX_TEST_CHECK="3. Verificar o estado"
PLG_J2COMMERCE_PAYMENT_PAYPAL_SANDBOX_TEST_CANCEL="4. Cancelar a subscrição de teste"
PLG_J2COMMERCE_PAYMENT_PAYPAL_SANDBOX_TEST_NVP="5. Testar as credenciais NVP"
PLG_J2COMMERCE_PAYMENT_PAYPAL_SANDBOX_TEST_SUBID_LABEL="ID da subscrição do PayPal"
PLG_J2COMMERCE_PAYMENT_PAYPAL_SANDBOX_TEST_SUBID_HELP="Preenchido automaticamente após o passo 2. Utilizado nas opções «Verificar o estado» e «Cancelar»."

