; Configuration - Subscription mode toggle
PLG_J2COMMERCE_PAYMENT_PAYPAL_SUBSCRIPTION_MODE_LABEL="Modo de criação de subscrições"
PLG_J2COMMERCE_PAYMENT_PAYPAL_SUBSCRIPTION_MODE_DESC="<strong>Controla a forma como as NOVAS subscrições são criadas no momento do pagamento.</strong> As renovações são sempre encaminhadas por metakey, pelo que as subscrições criadas em qualquer um dos modos continuam a funcionar quando esta opção é alterada.<br><br><strong>REST moderno</strong> (predefinição): o cliente utiliza a janela pop-up dos Smart Buttons → agendamento recorrente do lado do PayPal → o cron da aplicação efetua cobranças forçadas através de /v1/billing/subscriptions/{id}/capture. Armazenado como paypal_subscription_id metakey.<br><br><strong>NVP antigo</strong> (compatível com o J2Store): o cliente é redirecionado para o PayPal Express Checkout clássico → BAID devolvido → o cron da aplicação efetua a cobrança através de DoReferenceTransaction. Armazenado como billing_agreement_id metakey. Utilize esta opção ao migrar do J2Store com a intenção de que uma ferramenta de migração converta posteriormente os BAID antigos para valores paypal_subscription_id modernos."
PLG_J2COMMERCE_PAYMENT_PAYPAL_SUBSCRIPTION_MODE_REST="API moderna de subscrições REST (Smart Buttons)"
PLG_J2COMMERCE_PAYMENT_PAYPAL_SUBSCRIPTION_MODE_NVP="NVP antigo / Express Checkout (compatível com o J2Store)"

; Configuration - NVP credentials (legacy J2Store BAID renewals — Path C hybrid)
PLG_J2COMMERCE_PAYMENT_PAYPAL_NVP_SECTION_LABEL="Credenciais da API NVP (apenas para renovações antigas)"
PLG_J2COMMERCE_PAYMENT_PAYPAL_NVP_SECTION_DESC="<strong>Obrigatório APENAS quando existirem subscrições do J2Store migradas (linhas em #__j2commerce_metafields com metakey=billing_agreement_id).</strong> O PayPal deixou de emitir credenciais NVP a novos comerciantes em 2023 — se for um novo comerciante, deixe estes campos em branco; as subscrições a partir deste momento utilizam o fluxo REST moderno. Comerciantes J2Store existentes: localize api_username, api_password e api_signature em PayPal → Definições da conta → Acesso à conta → Acesso à API → Integração da API NVP/SOAP → Gerir credenciais da API."
PLG_J2COMMERCE_PAYMENT_PAYPAL_NVP_API_USERNAME="Nome de utilizador da API NVP (produção)"
PLG_J2COMMERCE_PAYMENT_PAYPAL_NVP_API_USERNAME_DESC="api_username NVP de produção, em «Gerir credenciais da API» do PayPal."
PLG_J2COMMERCE_PAYMENT_PAYPAL_NVP_API_PASSWORD="Palavra-passe da API NVP (produção)"
PLG_J2COMMERCE_PAYMENT_PAYPAL_NVP_API_PASSWORD_DESC="api_password NVP de produção, em «Gerir credenciais da API» do PayPal."
PLG_J2COMMERCE_PAYMENT_PAYPAL_NVP_API_SIGNATURE="Assinatura da API NVP (produção)"
PLG_J2COMMERCE_PAYMENT_PAYPAL_NVP_API_SIGNATURE_DESC="api_signature NVP de produção, em «Gerir credenciais da API» do PayPal."
PLG_J2COMMERCE_PAYMENT_PAYPAL_NVP_SANDBOX_API_USERNAME="Nome de utilizador da API NVP (sandbox)"
