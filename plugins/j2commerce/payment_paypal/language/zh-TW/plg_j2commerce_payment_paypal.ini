; Configuration - Subscription mode toggle
PLG_J2COMMERCE_PAYMENT_PAYPAL_SUBSCRIPTION_MODE_LABEL="訂閱建立模式"
PLG_J2COMMERCE_PAYMENT_PAYPAL_SUBSCRIPTION_MODE_DESC="<strong>控制結帳時如何建立新訂閱。</strong> 續訂始終透過 metakey 進行路由，因此無論在何種模式下建立的訂閱，當此切換開關變更時皆能持續運作。<br><br><strong>現代 REST</strong>（預設）：客戶使用 Smart Buttons 彈出視窗 → PayPal 端定期付款排程 → 應用程式透過 /v1/billing/subscriptions/{id}/capture 由 cron 強制扣款。儲存為 paypal_subscription_id metakey。<br><br><strong>舊版 NVP</strong>（與 J2Store 相容）：客戶重新導向至經典 PayPal Express Checkout → 返回 BAID → 應用程式透過 DoReferenceTransaction 以 cron 排程進行扣款。儲存為 billing_agreement_id metakey。當從 J2Store 遷移時，若預期日後將透過遷移工具將舊版 BAID 轉換為現代 paypal_subscription_id 值，請使用此模式。"
PLG_J2COMMERCE_PAYMENT_PAYPAL_SUBSCRIPTION_MODE_REST="現代 REST 訂閱 API（Smart Buttons）"
PLG_J2COMMERCE_PAYMENT_PAYPAL_SUBSCRIPTION_MODE_NVP="舊版 NVP / Express Checkout（與 J2Store 相容）"

; Configuration - NVP credentials (legacy J2Store BAID renewals — Path C hybrid)
PLG_J2COMMERCE_PAYMENT_PAYPAL_NVP_SECTION_LABEL="NVP API 憑證（僅限舊版續訂）"
PLG_J2COMMERCE_PAYMENT_PAYPAL_NVP_SECTION_DESC="<strong>僅當存在已遷移的 J2Store 訂閱時才需填寫（#__j2commerce_metafields 中 metakey=billing_agreement_id 的資料列）。</strong> PayPal 已於 2023 年停止向新商家發行 NVP 憑證 — 若您是新商家，請將這些欄位留空；此後建立的訂閱將採用現代 REST 流程。現有 J2Store 商家：請前往 PayPal → 帳戶設定 → 帳戶存取 → API 存取 → NVP/SOAP API 整合 → 管理 API 憑證，查找 api_username、api_password 及 api_signature。"
