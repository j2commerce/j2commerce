; Sandbox subscription test harness (admin-only, sandbox-mode-only)
PLG_J2COMMERCE_PAYMENT_PAYPAL_SANDBOX_TEST_LABEL="沙盒環境訂閱測試平台"
PLG_J2COMMERCE_PAYMENT_PAYPAL_SANDBOX_TEST_DESC="<strong>1. 測試憑證</strong> — 驗證沙盒環境的 client_id 及密鑰能否取得有效的 OAuth 權杖。<br><strong>2. 建立訂閱</strong> — 在您的沙盒環境中建立真實的目錄商品、計費方案（$1.00/day × 5 週期）以及訂閱。系統會返回一個核准連結 — 點擊該連結，使用沙盒環境的 PERSONAL 帳戶登入並進行核准。<br><strong>3. 檢查狀態</strong> — 貼上 I-XXXX 訂閱 ID，並確認核准後 remote_status 已切換為 ACTIVE。<br><strong>4. 取消</strong> — 清理測試訂閱，以免持續向沙盒環境帳戶收費。"
