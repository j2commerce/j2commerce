PLG_J2COMMERCE_APP_DIAGNOSTICS_MAIL_TEST_DESC="ご自身のアカウントアドレス宛てに、エンベロープ送信者を含むメッセージと含まないメッセージの2通を送信し、このサーバーが両方を受け付けるかどうかを確認します。"
