PLG_J2COMMERCE_APP_DIAGNOSTICS_PAYMENT_RULE_MODE="Требовать оплату за подтверждённые заказы"
PLG_J2COMMERCE_APP_DIAGNOSTICS_PAYMENT_RULE_MODE_OFF="Выкл."
