; Plugin Description
PLG_J2COMMERCE_APP_DIAGNOSTICS="Приложение J2Commerce Diagnostics"
PLG_J2COMMERCE_APP_DIAGNOSTICS_DESCRIPTION="Приложение J2Commerce Diagnostics поможет вам диагностировать некоторые из распространённых проблем. При обращении в службу поддержки предоставьте информацию о системе, указанную в этом приложении."

; Basic Settings
PLG_J2COMMERCE_APP_DIAGNOSTICS_BASIC="Информация о системе"
PLG_J2COMMERCE_APP_DIAGNOSTICS_NOTE="Инструмент диагностики"
PLG_J2COMMERCE_APP_DIAGNOSTICS_NOTE_DESCRIPTION="Этот инструмент поможет вам диагностировать некоторые из наиболее распространённых проблем. При отправке запроса в службу поддержки просим предоставить приведённую здесь информацию о системе."

