; Plugin Description
PLG_J2COMMERCE_APP_DIAGNOSTICS="Приложение J2Commerce Diagnostics"
PLG_J2COMMERCE_APP_DIAGNOSTICS_DESCRIPTION="Приложение J2Commerce Diagnostics поможет вам диагностировать некоторые из распространённых проблем. При обращении в службу поддержки предоставьте информацию о системе, указанную в этом приложении."

