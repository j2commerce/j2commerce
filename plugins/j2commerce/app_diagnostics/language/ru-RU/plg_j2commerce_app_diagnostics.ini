PLG_J2COMMERCE_APP_DIAGNOSTICS_MAIL_FROM="Адрес отправителя"
PLG_J2COMMERCE_APP_DIAGNOSTICS_MAIL_ENVELOPE="Отправитель конверта"
PLG_J2COMMERCE_APP_DIAGNOSTICS_MAIL_ENVELOPE_SENT="Отправлено как -f%s. Некоторые хостинг-провайдеры отклоняют отправителя, указанного в конверте, и сразу же отклоняют сообщение."
PLG_J2COMMERCE_APP_DIAGNOSTICS_MAIL_ENVELOPE_NOT_SENT="Не отправлено, соответствует ядру Joomla"
PLG_J2COMMERCE_APP_DIAGNOSTICS_MAIL_SMTP_HOST="SMTP-хост"
PLG_J2COMMERCE_APP_DIAGNOSTICS_MAIL_SMTP_SECURE="Безопасность SMTP"
PLG_J2COMMERCE_APP_DIAGNOSTICS_MAIL_SMTP_AUTH="Аутентификация SMTP (имя пользователя и пароль заданы)"
PLG_J2COMMERCE_APP_DIAGNOSTICS_MAIL_SENDMAIL_PATH="sendmail_path"
PLG_J2COMMERCE_APP_DIAGNOSTICS_MAIL_FORCE_EXTRA="mail.force_extra_parameters"
PLG_J2COMMERCE_APP_DIAGNOSTICS_MAIL_SILENT_FALLBACK="Выбран протокол SMTP, но его не удалось настроить, поэтому для отправки почты используется функция PHP mail. Убедитесь, что хост SMTP, порт и учётные данные заполнены и сохранены."
PLG_J2COMMERCE_APP_DIAGNOSTICS_MAIL_TEST_DESC="Отправляет два сообщения на адрес Вашей учётной записи: одно с указанием отправителя в конверте, другое — без него, чтобы проверить, принимает ли данный сервер оба варианта."
PLG_J2COMMERCE_APP_DIAGNOSTICS_MAIL_TEST_BUTTON="Запустить тест почтовой передачи"
PLG_J2COMMERCE_APP_DIAGNOSTICS_MAIL_TEST_RUNNING="Отправляются два тестовых сообщения..."
PLG_J2COMMERCE_APP_DIAGNOSTICS_MAIL_TEST_ERROR="Тест почтовой передачи не удалось завершить."
PLG_J2COMMERCE_APP_DIAGNOSTICS_MAIL_TEST_WITHOUT_F="Без указания отправителя в конверте"
PLG_J2COMMERCE_APP_DIAGNOSTICS_MAIL_TEST_WITH_F="С указанием отправителя в конверте"
PLG_J2COMMERCE_APP_DIAGNOSTICS_MAIL_TEST_NOT_APPLICABLE="Данное тестирование относится к механизму отправки почты через PHP. В настоящее время сайт отправляет сообщения через %s."
PLG_J2COMMERCE_APP_DIAGNOSTICS_MAIL_TEST_NO_ADDRESS="Для выполнения данного теста необходимы как действительный адрес отправителя, так и адрес электронной почты учётной записи."
PLG_J2COMMERCE_APP_DIAGNOSTICS_MAIL_TEST_SUBJECT_A="Тест почтовой передачи, без отправителя в конверте"
PLG_J2COMMERCE_APP_DIAGNOSTICS_MAIL_TEST_SUBJECT_B="Тест почтовой передачи, с отправителем в конверте"
PLG_J2COMMERCE_APP_DIAGNOSTICS_MAIL_TEST_VERDICT_REJECTS_F="Данный сервер отклоняет отправителя конверта. Сообщения, в которых указан этот параметр, не будут отправлены, тогда как сообщения без него будут отправлены."
PLG_J2COMMERCE_APP_DIAGNOSTICS_MAIL_TEST_VERDICT_BOTH_OK="Оба сообщения были приняты, поэтому отправитель конверта не является причиной какого-либо сбоя в данном случае."
PLG_J2COMMERCE_APP_DIAGNOSTICS_MAIL_TEST_VERDICT_BOTH_FAIL="Ни одно из сообщений не было принято, поэтому функция PHP mail на данном сервере не работает."
PLG_J2COMMERCE_APP_DIAGNOSTICS_MAIL_TEST_VERDICT_ONLY_F="Было принято только сообщение с указанием отправителя в конверте. Пожалуйста, отправьте этот результат в службу поддержки."
