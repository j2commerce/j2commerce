; Mail transport diagnostics
PLG_J2COMMERCE_APP_DIAGNOSTICS_MAIL_HEADING="Передача почты"
PLG_J2COMMERCE_APP_DIAGNOSTICS_MAIL_INTRO="Тест отправки почты в разделе «Глобальные настройки» осуществляется с использованием значений, указанных в данной форме на данный момент. В строках ниже отображается транспортный механизм, создаваемый Joomla на основе СОХРАНЁННЫХ настроек, которые фактически используются при отправке всех электронных писем магазина."
PLG_J2COMMERCE_APP_DIAGNOSTICS_MAIL_ONLINE="Отправить письмо"
PLG_J2COMMERCE_APP_DIAGNOSTICS_MAIL_SAVED="Почтовый модуль (сохранённые настройки)"
PLG_J2COMMERCE_APP_DIAGNOSTICS_MAIL_BUILT="Используемый канал передачи"
PLG_J2COMMERCE_APP_DIAGNOSTICS_MAIL_FROM="Адрес отправителя"
PLG_J2COMMERCE_APP_DIAGNOSTICS_MAIL_ENVELOPE="Отправитель конверта"
PLG_J2COMMERCE_APP_DIAGNOSTICS_MAIL_ENVELOPE_SENT="Отправлено как -f%s. Некоторые хостинг-провайдеры отклоняют отправителя, указанного в конверте, и сразу же отклоняют сообщение."
PLG_J2COMMERCE_APP_DIAGNOSTICS_MAIL_ENVELOPE_NOT_SENT="Не отправлено, соответствует ядру Joomla"
PLG_J2COMMERCE_APP_DIAGNOSTICS_MAIL_SMTP_HOST="SMTP-хост"
PLG_J2COMMERCE_APP_DIAGNOSTICS_MAIL_SMTP_SECURE="Безопасность SMTP"
