; Mail transport diagnostics
PLG_J2COMMERCE_APP_DIAGNOSTICS_MAIL_HEADING="Передача почты"
PLG_J2COMMERCE_APP_DIAGNOSTICS_MAIL_INTRO="Тест отправки почты в разделе «Глобальные настройки» осуществляется с использованием значений, указанных в данной форме на данный момент. В строках ниже отображается транспортный механизм, создаваемый Joomla на основе СОХРАНЁННЫХ настроек, которые фактически используются при отправке всех электронных писем магазина."
PLG_J2COMMERCE_APP_DIAGNOSTICS_MAIL_ONLINE="Отправить письмо"
PLG_J2COMMERCE_APP_DIAGNOSTICS_MAIL_SAVED="Почтовый модуль (сохранённые настройки)"
