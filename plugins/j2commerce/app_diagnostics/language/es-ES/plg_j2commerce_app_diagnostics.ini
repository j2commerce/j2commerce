; Plugin Description
PLG_J2COMMERCE_APP_DIAGNOSTICS="Aplicación de diagnóstico de J2Commerce"
PLG_J2COMMERCE_APP_DIAGNOSTICS_DESCRIPTION="La aplicación de diagnóstico de J2Commerce le ayudará a diagnosticar algunos de los problemas más comunes. Cuando realice una solicitud de soporte, proporcione la información del sistema proporcionada en esta aplicación."

