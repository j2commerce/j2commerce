PLG_J2COMMERCE_APP_DIAGNOSTICS_MAIL_SILENT_FALLBACK="SMTP ist ausgewählt, konnte jedoch nicht eingerichtet werden, sodass E-Mails nun über die PHP-Mail-Funktion versendet werden. Bitte überprüfen Sie, ob der SMTP-Host, der Port und die Anmeldedaten vollständig eingegeben und gespeichert wurden."
PLG_J2COMMERCE_APP_DIAGNOSTICS_MAIL_TEST_DESC="Es versendet zwei Nachrichten an die Adresse Ihres eigenen Kontos – eine mit und eine ohne Absenderangabe im Umschlag –, um zu zeigen, ob dieser Server beide Varianten akzeptiert."
