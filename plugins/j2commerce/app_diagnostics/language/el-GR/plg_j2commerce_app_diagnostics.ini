; Mail transport diagnostics
PLG_J2COMMERCE_APP_DIAGNOSTICS_MAIL_HEADING="Μεταφορά αλληλογραφίας"
PLG_J2COMMERCE_APP_DIAGNOSTICS_MAIL_INTRO="Η δοκιμή αποστολής email από τις Γενικές ρυθμίσεις πραγματοποιείται χρησιμοποιώντας τις τιμές που υπάρχουν εκείνη τη στιγμή στη φόρμα. Οι παρακάτω σειρές παρουσιάζουν τη διαδικασία μεταφοράς που δημιουργεί το Joomla με βάση την ΑΠΟΘΗΚΕΥΜΕΝΗ διαμόρφωση, η οποία είναι αυτή που χρησιμοποιείται στην πράξη από κάθε email του καταστήματος."
PLG_J2COMMERCE_APP_DIAGNOSTICS_MAIL_ONLINE="Αποστολή αλληλογραφίας"
PLG_J2COMMERCE_APP_DIAGNOSTICS_MAIL_SAVED="Mailer (αποθηκευμένες ρυθμίσεις)"
PLG_J2COMMERCE_APP_DIAGNOSTICS_MAIL_BUILT="Μέθοδος μεταφοράς που χρησιμοποιείται"
PLG_J2COMMERCE_APP_DIAGNOSTICS_MAIL_FROM="Διεύθυνση αποστολέα"
PLG_J2COMMERCE_APP_DIAGNOSTICS_MAIL_ENVELOPE="Αποστολέας φακέλου"
PLG_J2COMMERCE_APP_DIAGNOSTICS_MAIL_ENVELOPE_SENT="Αποστέλλεται ως -f%s. Ορισμένοι πάροχοι φιλοξενίας απορρίπτουν τον αποστολέα του φακέλου και απορρίπτουν το μήνυμα αμέσως."
PLG_J2COMMERCE_APP_DIAGNOSTICS_MAIL_ENVELOPE_NOT_SENT="Δεν έχει σταλεί, συμβατό με τον πυρήνα του Joomla"
PLG_J2COMMERCE_APP_DIAGNOSTICS_MAIL_SMTP_HOST="Διακομιστής SMTP"
PLG_J2COMMERCE_APP_DIAGNOSTICS_MAIL_SMTP_SECURE="Ασφάλεια SMTP"
PLG_J2COMMERCE_APP_DIAGNOSTICS_MAIL_SMTP_AUTH="Πιστοποίηση SMTP (έχουν οριστεί χρήστης/κωδικός πρόσβασης)"
PLG_J2COMMERCE_APP_DIAGNOSTICS_MAIL_SENDMAIL_PATH="sendmail_path"
PLG_J2COMMERCE_APP_DIAGNOSTICS_MAIL_FORCE_EXTRA="mail.force_extra_parameters"
PLG_J2COMMERCE_APP_DIAGNOSTICS_MAIL_SILENT_FALLBACK="Έχει επιλεγεί το SMTP, αλλά δεν ήταν δυνατή η ρύθμισή του, οπότε η αποστολή αλληλογραφίας πραγματοποιείται μέσω της λειτουργίας PHP mail. Βεβαιωθείτε ότι ο διακομιστής SMTP, η θύρα και τα διαπιστευτήρια έχουν συμπληρωθεί και αποθηκευτεί."
PLG_J2COMMERCE_APP_DIAGNOSTICS_MAIL_TEST_DESC="Αποστέλλει δύο μηνύματα στη διεύθυνση του δικού σας λογαριασμού, ένα με αποστολέα φακέλου και ένα χωρίς, για να δείξει αν ο συγκεκριμένος διακομιστής δέχεται και τα δύο."
PLG_J2COMMERCE_APP_DIAGNOSTICS_MAIL_TEST_BUTTON="Εκτέλεση δοκιμής μεταφοράς αλληλογραφίας"
PLG_J2COMMERCE_APP_DIAGNOSTICS_MAIL_TEST_RUNNING="Αποστολή δύο δοκιμαστικών μηνυμάτων..."
PLG_J2COMMERCE_APP_DIAGNOSTICS_MAIL_TEST_ERROR="Η δοκιμή μεταφοράς αλληλογραφίας δεν μπόρεσε να ολοκληρωθεί."
PLG_J2COMMERCE_APP_DIAGNOSTICS_MAIL_TEST_WITHOUT_F="Χωρίς αποστολέα φακέλου"
PLG_J2COMMERCE_APP_DIAGNOSTICS_MAIL_TEST_WITH_F="Με αποστολέα φακέλου"
PLG_J2COMMERCE_APP_DIAGNOSTICS_MAIL_TEST_NOT_APPLICABLE="Αυτή η δοκιμή αφορά τη μεταφορά αλληλογραφίας μέσω PHP. Ο ιστότοπος αυτός στέλνει επί του παρόντος μέσω του %s."
PLG_J2COMMERCE_APP_DIAGNOSTICS_MAIL_TEST_NO_ADDRESS="Για την εκτέλεση αυτής της δοκιμής απαιτούνται τόσο μια έγκυρη διεύθυνση αποστολέα όσο και μια έγκυρη διεύθυνση ηλεκτρονικού ταχυδρομείου λογαριασμού."
PLG_J2COMMERCE_APP_DIAGNOSTICS_MAIL_TEST_SUBJECT_A="Δοκιμή μεταφοράς αλληλογραφίας, χωρίς αποστολέα φακέλου"
PLG_J2COMMERCE_APP_DIAGNOSTICS_MAIL_TEST_SUBJECT_B="Δοκιμή μεταφοράς αλληλογραφίας, με αποστολέα φακέλου"
PLG_J2COMMERCE_APP_DIAGNOSTICS_MAIL_TEST_VERDICT_REJECTS_F="Αυτός ο διακομιστής απορρίπτει τον αποστολέα του φακέλου. Τα μηνύματα που ορίζουν έναν αποστολέα θα αποτύχουν, ενώ τα μηνύματα που δεν ορίζουν θα αποσταλούν."
PLG_J2COMMERCE_APP_DIAGNOSTICS_MAIL_TEST_VERDICT_BOTH_OK="Και τα δύο μηνύματα έγιναν αποδεκτά, οπότε ο αποστολέας του φακέλου δεν αποτελεί την αιτία της αποτυχίας σε αυτή την περίπτωση."
PLG_J2COMMERCE_APP_DIAGNOSTICS_MAIL_TEST_VERDICT_BOTH_FAIL="Κανένα από τα δύο μηνύματα δεν έγινε αποδεκτό, επομένως η λειτουργία αλληλογραφίας του PHP δεν λειτουργεί σε αυτόν τον διακομιστή."
PLG_J2COMMERCE_APP_DIAGNOSTICS_MAIL_TEST_VERDICT_ONLY_F="Έγινε αποδεκτό μόνο το μήνυμα με αποστολέα φακέλου. Παρακαλούμε στείλτε αυτό το αποτέλεσμα στην υποστήριξη."
