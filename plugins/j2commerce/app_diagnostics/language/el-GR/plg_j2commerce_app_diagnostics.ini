PLG_J2COMMERCE_APP_DIAGNOSTICS_MINIMUM_MEMORY_LIMIT_WARNING="Συνιστούμε τουλάχιστον 64 MB μνήμης για την αποτελεσματική λειτουργία του καταστήματος. Το κατάστημα θα λειτουργεί και σε διακομιστές με όριο μνήμης 48 MB. Εάν έχετε πολύπλοκες διαμορφώσεις προϊόντων, η μνήμη ενδέχεται να μην είναι επαρκής, καθώς το ίδιο το Joomla! καταναλώνει σημαντική ποσότητα μνήμης."
