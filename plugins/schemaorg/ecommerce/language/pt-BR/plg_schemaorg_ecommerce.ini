PLG_SCHEMAORG_ECOMMERCE="Schema.org - Comércio eletrônico"
PLG_SCHEMAORG_ECOMMERCE_XML_DESCRIPTION="Este plug-in adiciona suporte a dados estruturados de comércio eletrônico (produtos) utilizando a marcação do schema.org. Ele se integra ao J2Commerce para gerar automaticamente rich snippets para produtos, preços e disponibilidade."
PLG_SCHEMAORG_ECOMMERCE_TAB_EXISTING="Dados de produtos existentes"
PLG_SCHEMAORG_ECOMMERCE_TAB_EXISTING_DESC="Informações do produto detectadas automaticamente pelo J2Commerce. Esses dados serão utilizados, a menos que sejam substituídos."
PLG_SCHEMAORG_ECOMMERCE_TAB_OVERRIDE="Substituições de esquema"
PLG_SCHEMAORG_ECOMMERCE_TAB_OVERRIDE_DESC="Substitua os valores detectados automaticamente. Deixe os campos em branco para usar os valores detectados."
PLG_SCHEMAORG_ECOMMERCE_OVERRIDE_NOTE="Deixe os campos em branco para utilizar os valores detectados automaticamente pelo J2Commerce. Quaisquer valores que o senhor inserir aqui substituirão os dados detectados no esquema gerado."
PLG_SCHEMAORG_ECOMMERCE_DESCRIPTION_LABEL="Selecione “E-commerce” como tipo de esquema para gerar dados estruturados de produto. Se este artigo estiver vinculado a um produto do J2Commerce, os dados do produto serão detectados automaticamente e mesclados com quaisquer substituições que o senhor especificar abaixo."
PLG_SCHEMAORG_ECOMMERCE_FIELD_AUTO_DETECT_LABEL="Ativar a detecção automática"
PLG_SCHEMAORG_ECOMMERCE_FIELD_AUTO_DETECT_DESC="Detecte automaticamente os dados de produtos do J2Commerce e mescle-os com a saída do esquema."
PLG_SCHEMAORG_ECOMMERCE_FIELD_CURRENCY_LABEL="Moeda da loja"
PLG_SCHEMAORG_ECOMMERCE_FIELD_CURRENCY_DESC="O código da moeda configurado no J2Commerce (config_currency). Este campo é somente para leitura e reflete as configurações da sua loja no J2Commerce."
PLG_SCHEMAORG_ECOMMERCE_JCOMMERCE_NOT_CONFIGURED="O J2Commerce não está instalado ou não está configurado. Por favor, configure o J2Commerce para definir a moeda da sua loja."
PLG_SCHEMAORG_ECOMMERCE_FIELD_BRAND_LABEL="Marca padrão"
PLG_SCHEMAORG_ECOMMERCE_FIELD_BRAND_DESC="Nome de marca padrão a ser utilizado quando nenhuma marca for detectada nos dados do produto."
