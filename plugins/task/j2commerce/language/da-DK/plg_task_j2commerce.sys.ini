PLG_TASK_J2COMMERCE_CLEANUP_ORDER_UPLOADS_DESC="Fjerner kunde-uploadede ordrefiler i henhold til opbevaringsregler. Fejer forældreløse tmp-uploads efter deres udløb og/eller filer, der er knyttet til ordrer i udvalgte statusser efter den konfigurerede opbevaring. Leveres med dry_run=1 som standard - gennemgå loggen, og deaktiver dry_run, når du er tilfreds."
