PLG_TASK_J2COMMERCE="Task - J2Commerce"
PLG_TASK_J2COMMERCE_XML_DESCRIPTION="Automated maintenance tasks for J2Commerce. Includes cleanup of abandoned orders and other scheduled routines."
PLG_TASK_J2COMMERCE_CLEANUP_ORDER_UPLOADS_DESC="Removes customer-uploaded order files according to retention rules. Sweeps orphaned tmp uploads past their expiry, and/or files attached to orders in selected statuses past the configured retention. Ships with dry_run=1 by default — review the log, then disable dry_run when you're satisfied."
PLG_TASK_J2COMMERCE_CLEANUP_ORDER_UPLOADS_TITLE="J2Commerce: Clean up order upload files"
PLG_TASK_J2COMMERCE_CLEANUP_QUEUE_LOGS_DESC="Deletes old queue execution logs and completed queue items to keep the database clean."
PLG_TASK_J2COMMERCE_CLEANUP_QUEUE_LOGS_TITLE="J2Commerce: Cleanup Queue Logs"
PLG_TASK_J2COMMERCE_CLEAR_OUTDATED_CARTS_DESC="Deletes abandoned shopping carts and their items past the configured retention term. Runs the same cleanup as the Diagnostics app plugin's cron hook."
PLG_TASK_J2COMMERCE_CLEAR_OUTDATED_CARTS_TITLE="J2Commerce: Clear Outdated Carts"
PLG_TASK_J2COMMERCE_PROCESS_QUEUE_DESC="Processes pending items in the J2Commerce queue. Creates execution logs for auditing."
PLG_TASK_J2COMMERCE_PROCESS_QUEUE_TITLE="J2Commerce: Process Queue"
PLG_TASK_J2COMMERCE_SCHEDULED_TICK_DESC="Fires the onJ2CommerceScheduledTick event so J2Commerce app plugins can run periodic work without shipping a task plugin of their own. Each subscriber runs in isolation, so one failing extension does not stop the others."
PLG_TASK_J2COMMERCE_SCHEDULED_TICK_TITLE="J2Commerce: Scheduled Tick"
PLG_TASK_J2COMMERCE_SEND_CART_REMINDERS_DESC="Emails shoppers about carts they left, once each cart has been idle for the delay set in J2Commerce Options, Emails tab. Run it at least hourly; a web cron or CLI trigger keeps the timing accurate on a quiet store. The links in the email need the Email Site URL in those options, live_site in configuration.php, or a CLI run with --live-site. It does nothing while Cart Reminder Emails is switched off."
PLG_TASK_J2COMMERCE_SEND_CART_REMINDERS_TITLE="J2Commerce: Send Cart Reminders"
