PLG_TASK_J2COMMERCE="Задача - J2Commerce"
PLG_TASK_J2COMMERCE_XML_DESCRIPTION="Автоматизированные задачи обслуживания для J2Commerce. Включает в себя очистку заброшенных заказов и другие запланированные процедуры."
PLG_TASK_J2COMMERCE_CLEANUP_QUEUE_LOGS_DESC="Удаляет старые журналы выполнения очередей и завершенные элементы очередей, чтобы сохранить базу данных чистой."
PLG_TASK_J2COMMERCE_CLEANUP_QUEUE_LOGS_TITLE="J2Commerce: Очистка журналов очередей"
PLG_TASK_J2COMMERCE_CLEAR_OUTDATED_CARTS_DESC="Удаляет брошенные корзины и содержащиеся в них товары по истечении настроенного срока хранения. Выполняет ту же очистку, что и cron-хук плагина приложения Diagnostics."
PLG_TASK_J2COMMERCE_CLEAR_OUTDATED_CARTS_TITLE="J2Commerce: Очистка устаревших корзин"
PLG_TASK_J2COMMERCE_PROCESS_QUEUE_DESC="Обрабатывает отложенные элементы в очереди J2Commerce. Создает журналы выполнения для аудита."
PLG_TASK_J2COMMERCE_PROCESS_QUEUE_TITLE="J2Commerce: Очередь обработки"
PLG_TASK_J2COMMERCE_SCHEDULED_TICK_DESC="Вызывает событие onJ2CommerceScheduledTick, чтобы плагины приложения J2Commerce могли выполнять периодические задачи без необходимости предоставления собственного плагина задач. Каждый подписчик работает изолированно, поэтому сбой одного расширения не приводит к остановке работы остальных."
PLG_TASK_J2COMMERCE_SCHEDULED_TICK_TITLE="J2Commerce: Запланированный тик"

; ── Issue #1060 — uploaded-files lifecycle (PR #1059 follow-up) ──
PLG_TASK_J2COMMERCE_CLEANUP_ORDER_UPLOADS_DESC="Удаляет загруженные клиентом файлы заказов в соответствии с правилами хранения. Удаляет осиротевшие tmp-загрузки, срок хранения которых истек, и/или файлы, прикрепленные к заказам в выбранных статусах, которые были сохранены дольше установленного срока. По умолчанию поставляется с dry_run=1 - просмотрите журнал, затем отключите dry_run, если Вас все устраивает."
PLG_TASK_J2COMMERCE_CLEANUP_ORDER_UPLOADS_TITLE="J2Commerce: Очистка файлов загрузки заказов"
