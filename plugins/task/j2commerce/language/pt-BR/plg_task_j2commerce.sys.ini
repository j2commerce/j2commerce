PLG_TASK_J2COMMERCE="Tarefas Agendadas - J2Commerce"
PLG_TASK_J2COMMERCE_XML_DESCRIPTION="Tarefas de manutenção automatizadas para o J2Commerce. Inclui limpeza de pedidos abandonados e outras rotinas agendadas."
PLG_TASK_J2COMMERCE_CLEANUP_ORDER_UPLOADS_DESC="Limpa arquivos enviados em pedidos conforme regras."
PLG_TASK_J2COMMERCE_CLEANUP_ORDER_UPLOADS_TITLE="J2Commerce: Limpar arquivos de uploads de pedidos"
PLG_TASK_J2COMMERCE_CLEANUP_QUEUE_LOGS_DESC="Exclui logs de execução de fila antigos e itens de fila concluídos para manter o banco de dados limpo."
PLG_TASK_J2COMMERCE_CLEANUP_QUEUE_LOGS_TITLE="J2Commerce: Limpar Logs de Fila"
PLG_TASK_J2COMMERCE_CLEAR_OUTDATED_CARTS_DESC="Exclui carrinhos de compras abandonados e seus itens que ultrapassaram o prazo de retenção configurado. Executa a mesma limpeza que o gancho cron do plug-in do aplicativo Diagnostics."
PLG_TASK_J2COMMERCE_CLEAR_OUTDATED_CARTS_TITLE="J2Commerce: Limpar carrinhos desatualizados"
PLG_TASK_J2COMMERCE_PROCESS_QUEUE_DESC="Processa itens pendentes na fila do J2Commerce. Cria logs de execução para auditoria."
PLG_TASK_J2COMMERCE_PROCESS_QUEUE_TITLE="J2Commerce: Processar Fila"
PLG_TASK_J2COMMERCE_SCHEDULED_TICK_DESC="Dispara o evento onJ2CommerceScheduledTick para que os plug-ins do aplicativo J2Commerce possam executar tarefas periódicas sem a necessidade de fornecer um plug-in de tarefas próprio. Cada assinante é executado de forma isolada; portanto, uma extensão com falha não interrompe as demais."
PLG_TASK_J2COMMERCE_SCHEDULED_TICK_TITLE="J2Commerce: Tarefa agendada"
