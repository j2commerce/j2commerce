PLG_TASK_J2COMMERCE="Tarea - J2Commerce"
PLG_TASK_J2COMMERCE_XML_DESCRIPTION="Tareas de mantenimiento automatizadas para J2Commerce. Incluye limpieza de pedidos abandonados y otras rutinas programadas."
PLG_TASK_J2COMMERCE_CLEANUP_QUEUE_LOGS_DESC="Elimina los registros de ejecución de colas antiguas y los elementos de cola completados para mantener limpia la base de datos."
PLG_TASK_J2COMMERCE_CLEANUP_QUEUE_LOGS_TITLE="J2Commerce: Limpiar registros de cola"
PLG_TASK_J2COMMERCE_CLEAR_OUTDATED_CARTS_DESC="Elimina los carritos de la compra abandonados y sus artículos una vez superado el plazo de retención configurado. Ejecuta la misma limpieza que el gancho cron del plugin de aplicación Diagnostics."
PLG_TASK_J2COMMERCE_CLEAR_OUTDATED_CARTS_TITLE="J2Commerce: Borrar carritos caducados"
PLG_TASK_J2COMMERCE_PROCESS_QUEUE_DESC="Procesa los elementos pendientes en la cola de J2Commerce. Crea registros de ejecución para auditoría."
PLG_TASK_J2COMMERCE_PROCESS_QUEUE_TITLE="J2Commerce: Cola de procesamiento"
PLG_TASK_J2COMMERCE_SCHEDULED_TICK_DESC="Activa el evento onJ2CommerceScheduledTick para que los complementos de la aplicación J2Commerce puedan ejecutar tareas periódicas sin necesidad de incluir un complemento de tareas propio. Cada suscriptor se ejecuta de forma aislada, por lo que el fallo de una extensión no detiene el funcionamiento de las demás."
PLG_TASK_J2COMMERCE_SCHEDULED_TICK_TITLE="J2Commerce: Tarea programada"

; ── Issue #1060 — uploaded-files lifecycle (PR #1059 follow-up) ──
PLG_TASK_J2COMMERCE_CLEANUP_ORDER_UPLOADS_DESC="Elimina los archivos de pedidos cargados por el cliente de acuerdo con las reglas de retención. Barre las subidas tmp huérfanas más allá de su caducidad, y/o los archivos adjuntos a pedidos en estados seleccionados más allá de la retención configurada. Se envía con dry_run=1 por defecto - revise el registro, luego desactive dry_run cuando esté satisfecho."
PLG_TASK_J2COMMERCE_CLEANUP_ORDER_UPLOADS_TITLE="J2Commerce: Limpiar archivos de subida de pedidos"
