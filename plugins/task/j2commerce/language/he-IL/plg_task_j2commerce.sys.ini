PLG_TASK_J2COMMERCE_CLEAR_OUTDATED_CARTS_DESC="מוחקת עגלות קניות נטושות והפריטים שבהן לאחר חלוף תקופת השמירה שהוגדרה. מבצעת את אותו הניקוי כמו ה-cron hook של תוסף האפליקציה Diagnostics."
PLG_TASK_J2COMMERCE_CLEAR_OUTDATED_CARTS_TITLE="J2Commerce: ניקוי עגלות מיושנות"
PLG_TASK_J2COMMERCE_PROCESS_QUEUE_DESC="מעבד פריטים הממתינים בתור של J2Commerce. יוצר יומני ביצוע לצורך ביקורת."
PLG_TASK_J2COMMERCE_PROCESS_QUEUE_TITLE="J2Commerce: תור עיבוד"
PLG_TASK_J2COMMERCE_SCHEDULED_TICK_DESC="מפעיל את האירוע onJ2CommerceScheduledTick כדי שתוספי האפליקציה של J2Commerce יוכלו לבצע פעולות תקופתיות מבלי שיצטרכו לשלוח תוסף משימות משלהם. כל מנוי פועל באופן מבודד, כך שתוסף אחד שכשל לא עוצר את האחרים."
PLG_TASK_J2COMMERCE_SCHEDULED_TICK_TITLE="J2Commerce: Tick מתוזמן"

