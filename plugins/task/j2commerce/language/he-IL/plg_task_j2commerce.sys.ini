PLG_TASK_J2COMMERCE_CLEANUP_ORDER_UPLOADS_DESC="מסיר קבצי הזמנות שהועלו על ידי לקוחות בהתאם לכללי השמירה. מוחק העלאות tmp יתומות שחלף מועד התפוגה שלהן, ו/או קבצים המצורפים להזמנות במצבים נבחרים שחלף מועד השמירה שהוגדר. נשלח עם dry_run=1 כברירת מחדל - בדוק את היומן, ואז השבת את dry_run כאשר אתה מרוצה"
PLG_TASK_J2COMMERCE_CLEANUP_ORDER_UPLOADS_TITLE="J2Commerce: ניקוי קבצי העלאת הזמנות"
