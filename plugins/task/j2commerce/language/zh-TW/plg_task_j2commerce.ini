PLG_TASK_J2COMMERCE="任務 - J2Commerce"
PLG_TASK_J2COMMERCE_XML_DESCRIPTION="J2Commerce 的自動化維護任務。包括清理放棄的訂單和其他排程例程。"

; Clear Outdated Carts routine
PLG_TASK_J2COMMERCE_CLEAR_OUTDATED_CARTS_DESC="刪除已超過設定保留期限的棄置購物車及其商品。執行與 Diagnostics 應用程式外掛程式 cron 鉤子相同的清理作業。"
PLG_TASK_J2COMMERCE_CLEAR_OUTDATED_CARTS_FIELD_DRY_RUN="模擬執行"
PLG_TASK_J2COMMERCE_CLEAR_OUTDATED_CARTS_FIELD_DRY_RUN_DESC="預覽將清除多少過期購物車，但不會實際刪除任何項目。"
PLG_TASK_J2COMMERCE_CLEAR_OUTDATED_CARTS_TITLE="J2Commerce：清除過期購物車"

; Cleanup Queue Logs routine
PLG_TASK_J2COMMERCE_CLEANUP_QUEUE_LOGS_DESC="刪除舊的佇列執行記錄和已完成的佇列項目，以保持資料庫的乾淨。"
PLG_TASK_J2COMMERCE_CLEANUP_QUEUE_LOGS_FIELD_DRY_RUN="乾式運行"
PLG_TASK_J2COMMERCE_CLEANUP_QUEUE_LOGS_FIELD_DRY_RUN_DESC="預覽要刪除的內容，但不會實際刪除。"
PLG_TASK_J2COMMERCE_CLEANUP_QUEUE_LOGS_FIELD_OLDER_THAN_DAYS="刪除超過 (天) 的日誌"
PLG_TASK_J2COMMERCE_CLEANUP_QUEUE_LOGS_FIELD_OLDER_THAN_DAYS_DESC="超過此日期的日誌項目將會被刪除。"
PLG_TASK_J2COMMERCE_CLEANUP_QUEUE_LOGS_FIELD_PURGE_COMPLETED="清除超過 (天) 的已完成項目"
PLG_TASK_J2COMMERCE_CLEANUP_QUEUE_LOGS_FIELD_PURGE_COMPLETED_DESC="超過此時間的已完成佇列項目將會被刪除。"
PLG_TASK_J2COMMERCE_CLEANUP_QUEUE_LOGS_TITLE="J2Commerce：清理佇列日誌"

; Process Queue routine
PLG_TASK_J2COMMERCE_PROCESS_QUEUE_DESC="處理 J2Commerce 佇列中的待處理項目。建立執行日誌以供稽核。"
PLG_TASK_J2COMMERCE_PROCESS_QUEUE_FIELD_BATCH_SIZE="批次大小"
PLG_TASK_J2COMMERCE_PROCESS_QUEUE_FIELD_BATCH_SIZE_DESC="每次執行時要處理的最大佇列項目數量。"
PLG_TASK_J2COMMERCE_PROCESS_QUEUE_FIELD_QUEUE_TYPE="佇列類型"
PLG_TASK_J2COMMERCE_PROCESS_QUEUE_FIELD_QUEUE_TYPE_DESC="只處理此佇列類型。留空則處理所有類型。"
PLG_TASK_J2COMMERCE_PROCESS_QUEUE_FIELD_QUEUE_TYPE_HINT="例如：shipstation、quickbooks"
PLG_TASK_J2COMMERCE_PROCESS_QUEUE_FIELD_RELEASE_STALE="釋放過期鎖定 (分鐘)"
PLG_TASK_J2COMMERCE_PROCESS_QUEUE_FIELD_RELEASE_STALE_DESC="釋放超過這個分鐘的處理鎖。防止項目永久卡住。"
PLG_TASK_J2COMMERCE_PROCESS_QUEUE_TITLE="J2Commerce：處理佇列"

; Remove New Orders routine
PLG_TASK_J2COMMERCE_REMOVE_NEW_ORDERS_DESC="刪除超過指定天數的未完成訂單 (狀態：新)。所有相關的訂單資料 (項目、屬性、運費、稅項等) 都會被逐級刪除。"
PLG_TASK_J2COMMERCE_REMOVE_NEW_ORDERS_FIELD_DRY_RUN="乾式運行"
PLG_TASK_J2COMMERCE_REMOVE_NEW_ORDERS_FIELD_DRY_RUN_DESC="啟用時，該任務會報告哪些訂單會被刪除，但不會實際刪除它們。停用可執行真正的刪除。"
PLG_TASK_J2COMMERCE_REMOVE_NEW_ORDERS_FIELD_OLDER_THAN_DAYS="超過 (天)"
PLG_TASK_J2COMMERCE_REMOVE_NEW_ORDERS_FIELD_OLDER_THAN_DAYS_DESC="刪除超過此天數的棄置訂單。設定為 0 會刪除所有 New 狀態的訂單，不論訂單的時間長短。"
PLG_TASK_J2COMMERCE_REMOVE_NEW_ORDERS_TITLE="J2Commerce：刪除放棄的訂單"

; Scheduled Tick routine
PLG_TASK_J2COMMERCE_SCHEDULED_TICK_DESC="觸發 onJ2CommerceScheduledTick 事件，使 J2Commerce 應用程式外掛程式無需自行提供任務外掛程式，即可執行週期性工作。每個訂閱者皆在隔離環境中運行，因此即使其中一個外掛程式發生故障，也不會影響其他外掛程式的運作。"
PLG_TASK_J2COMMERCE_SCHEDULED_TICK_FIELD_CONTEXT="上下文"
PLG_TASK_J2COMMERCE_SCHEDULED_TICK_FIELD_CONTEXT_DESC="此參數會傳遞給每個訂閱者，由其決定當前上下文是否為自身。若留空，則執行所有訂閱者；若指定數值，則可排程不同的 Tick，例如為某個整合設定每小時觸發一次，而為另一個整合設定每晚觸發一次。"
PLG_TASK_J2COMMERCE_SCHEDULED_TICK_FIELD_CONTEXT_HINT="例如：每小時、每晚、mailerlite"
PLG_TASK_J2COMMERCE_SCHEDULED_TICK_TITLE="J2Commerce：排程 Tick"

; Update Currency Rates routine
PLG_TASK_J2COMMERCE_UPDATE_CURRENCY_RATES_DESC="從設定的 API 提供者擷取最新的貨幣匯率，並更新所有啟用的貨幣。在 J2Commerce Currency Updater 應用程式外掛中設定 API 提供者。"
PLG_TASK_J2COMMERCE_UPDATE_CURRENCY_RATES_TITLE="J2Commerce：更新貨幣匯率"

; ── Issue #1060 — uploaded-files lifecycle (PR #1059 follow-up) ──
PLG_TASK_J2COMMERCE_CLEANUP_ORDER_UPLOADS_DESC="根據保留規則刪除客戶上傳的訂單檔案。"
PLG_TASK_J2COMMERCE_CLEANUP_ORDER_UPLOADS_FIELD_CLEANUP_MODE="清理模式"
PLG_TASK_J2COMMERCE_CLEANUP_ORDER_UPLOADS_FIELD_CLEANUP_MODE_DESC="選擇要清理的上傳檔案集。"
PLG_TASK_J2COMMERCE_CLEANUP_ORDER_UPLOADS_FIELD_DELETE_DB_ROWS="刪除資料庫資料列"
PLG_TASK_J2COMMERCE_CLEANUP_ORDER_UPLOADS_FIELD_DELETE_DB_ROWS_DESC="啟用時，刪除 #__j2commerce_uploads 資料列和檔案。停用時，保留 status='deleted' 的資料列，以便管理員保留稽核線索。"
PLG_TASK_J2COMMERCE_CLEANUP_ORDER_UPLOADS_FIELD_DRY_RUN="乾運行"
PLG_TASK_J2COMMERCE_CLEANUP_ORDER_UPLOADS_FIELD_DRY_RUN_DESC="預覽哪些檔案會被刪除，但不會實際刪除任何內容。保守的預設設定 - 當您準備採取行動時，翻轉為「否」。"
PLG_TASK_J2COMMERCE_CLEANUP_ORDER_UPLOADS_FIELD_RETENTION_DAYS="保留天數（附加）"
PLG_TASK_J2COMMERCE_CLEANUP_ORDER_UPLOADS_FIELD_RETENTION_DAYS_DESC="在訂單最後一次狀態更改後，將訂單附件檔案至少保留這麼多天。"
PLG_TASK_J2COMMERCE_CLEANUP_ORDER_UPLOADS_FIELD_STATUS_IDS="訂單狀態"
PLG_TASK_J2COMMERCE_CLEANUP_ORDER_UPLOADS_FIELD_STATUS_IDS_DESC="只掃描這些狀態下訂單的附件檔案。未選擇表示不清查附加檔案。"
PLG_TASK_J2COMMERCE_CLEANUP_ORDER_UPLOADS_FIELD_TMP_RETENTION_DAYS="保留天數（孤兒）"
PLG_TASK_J2COMMERCE_CLEANUP_ORDER_UPLOADS_FIELD_TMP_RETENTION_DAYS_DESC="超過此天數的待上傳檔案將被視為「孤兒」，無論過期與否都會被刪除。"
PLG_TASK_J2COMMERCE_CLEANUP_ORDER_UPLOADS_MODE_ATTACHED="僅限附件上傳"
PLG_TASK_J2COMMERCE_CLEANUP_ORDER_UPLOADS_MODE_BOTH="兩者（孤兒 + 附件）"
PLG_TASK_J2COMMERCE_CLEANUP_ORDER_UPLOADS_MODE_ORPHANED="只上傳孤兒 tmp"
PLG_TASK_J2COMMERCE_CLEANUP_ORDER_UPLOADS_TITLE="J2Commerce：清理訂單上傳檔案"
