PLG_TASK_J2COMMERCE="Εργασία - J2Commerce"
PLG_TASK_J2COMMERCE_XML_DESCRIPTION="Αυτοματοποιημένες εργασίες συντήρησης για το J2Commerce. Περιλαμβάνει τον καθαρισμό εγκαταλελειμμένων παραγγελιών και άλλες προγραμματισμένες ρουτίνες."
PLG_TASK_J2COMMERCE_CLEANUP_QUEUE_LOGS_DESC="Διαγράφει τα παλιά αρχεία καταγραφής εκτέλεσης ουράς και τα ολοκληρωμένα στοιχεία ουράς για να διατηρεί τη βάση δεδομένων καθαρή."
PLG_TASK_J2COMMERCE_CLEANUP_QUEUE_LOGS_TITLE="J2Commerce: Καθαρισμός των αρχείων καταγραφής ουράς"
PLG_TASK_J2COMMERCE_CLEAR_OUTDATED_CARTS_DESC="Διαγράφει τα εγκαταλελειμμένα καλάθια αγορών και τα προϊόντα τους που έχουν υπερβεί την καθορισμένη περίοδο διατήρησης. Εκτελεί την ίδια διαδικασία εκκαθάρισης με το cron hook του πρόσθετου της εφαρμογής Diagnostics."
PLG_TASK_J2COMMERCE_CLEAR_OUTDATED_CARTS_TITLE="J2Commerce: Εκκαθάριση παλαιών καλαθιών"
PLG_TASK_J2COMMERCE_PROCESS_QUEUE_DESC="Επεξεργάζεται τα εκκρεμή στοιχεία στην ουρά J2Commerce. Δημιουργεί αρχεία καταγραφής εκτέλεσης για έλεγχο."
PLG_TASK_J2COMMERCE_PROCESS_QUEUE_TITLE="J2Commerce: Επεξεργασία ουράς"
PLG_TASK_J2COMMERCE_SCHEDULED_TICK_DESC="Ενεργοποιεί το συμβάν onJ2CommerceScheduledTick, ώστε τα πρόσθετα της εφαρμογής J2Commerce να μπορούν να εκτελούν περιοδικές εργασίες χωρίς να χρειάζεται να διαθέτουν δικό τους πρόσθετο εργασιών. Κάθε συνδρομητής εκτελείται ανεξάρτητα, οπότε η αποτυχία μιας επέκτασης δεν εμποδίζει τη λειτουργία των υπολοίπων."
PLG_TASK_J2COMMERCE_SCHEDULED_TICK_TITLE="J2Commerce: Προγραμματισμένο Tick"

; ── Issue #1060 — uploaded-files lifecycle (PR #1059 follow-up) ──
PLG_TASK_J2COMMERCE_CLEANUP_ORDER_UPLOADS_DESC="Αφαιρεί τα αρχεία παραγγελίας που έχουν φορτωθεί από τον πελάτη σύμφωνα με τους κανόνες διατήρησης. Σαρώνει τα ορφανά tmp uploads μετά τη λήξη τους και/ή τα αρχεία που είναι προσαρτημένα σε παραγγελίες σε επιλεγμένες καταστάσεις μετά τη διαμορφωμένη διατήρηση. Αποστέλλεται με dry_run=1 από προεπιλογή - ελέγξτε το αρχείο καταγραφής και απενεργοποιήστε το dry_run όταν είστε ικανοποιημένοι."
PLG_TASK_J2COMMERCE_CLEANUP_ORDER_UPLOADS_TITLE="J2Commerce: Καθαρισμός των αρχείων μεταφόρτωσης παραγγελιών"
