COM_J2COMMERCE_GUIDEDTOUR_MANAGING_COUNTRIES_STEP0_TITLE="Pesquisar países"
COM_J2COMMERCE_GUIDEDTOUR_MANAGING_COUNTRIES_STEP0_DESC="Utilize a caixa de pesquisa para localizar países específicos.<br>Por exemplo, digite “united” para localizar “Estados Unidos”, “Reino Unido”, etc. Em seguida, pressione “Enter”."
COM_J2COMMERCE_GUIDEDTOUR_MANAGING_COUNTRIES_STEP1_TITLE="Ativar ou desativar um país"
COM_J2COMMERCE_GUIDEDTOUR_MANAGING_COUNTRIES_STEP1_DESC="Selecione o status de um país para ativá-lo ou desativá-lo."
COM_J2COMMERCE_GUIDEDTOUR_MANAGING_COUNTRIES_STEP2_TITLE="Marque a caixa de seleção superior para selecionar todos os países"
COM_J2COMMERCE_GUIDEDTOUR_MANAGING_COUNTRIES_STEP2_DESC="Essa caixa de seleção específica permite que você selecione todos os países da página.<br>Mantenha a caixa de seleção marcada para ter acesso às ações em lote na barra de ferramentas."
COM_J2COMMERCE_GUIDEDTOUR_MANAGING_COUNTRIES_STEP3_TITLE="Selecione o botão “Ações”"
COM_J2COMMERCE_GUIDEDTOUR_MANAGING_COUNTRIES_STEP3_DESC="O botão “Ações” permite que você acesse as ações em lote para os países selecionados."
COM_J2COMMERCE_GUIDEDTOUR_MANAGING_COUNTRIES_STEP4_TITLE="Selecione a opção “Despublicar”"
COM_J2COMMERCE_GUIDEDTOUR_MANAGING_COUNTRIES_STEP4_DESC="A opção “Despublicar” permite que você desative todos os países selecionados de uma só vez."
COM_J2COMMERCE_GUIDEDTOUR_MANAGING_COUNTRIES_STEP5_TITLE="Parabéns!"
COM_J2COMMERCE_GUIDEDTOUR_MANAGING_COUNTRIES_STEP5_DESC="Agora é possível gerenciar os países disponíveis em sua loja.<br>Desativar um país impedirá que clientes desse país realizem compras,<br>o que pode ser útil por diversos motivos, como restrições legais ou limitações de envio."
