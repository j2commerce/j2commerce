COM_J2COMMERCE_GUIDEDTOUR_CREATING_PRODUCT_STEP0_TITLE="Criar um novo produto"
COM_J2COMMERCE_GUIDEDTOUR_CREATING_PRODUCT_STEP0_DESC="Selecione o botão <strong>Novo</strong> para criar um novo produto. Isso abrirá o editor de artigos do Joomla com o formulário de produto do J2Commerce."
COM_J2COMMERCE_GUIDEDTOUR_CREATING_PRODUCT_STEP1_TITLE="Adicionar um título de produto"
COM_J2COMMERCE_GUIDEDTOUR_CREATING_PRODUCT_STEP1_DESC="Insira um título descritivo para o seu produto. Esse é o título do artigo e será exibido como o nome do produto na sua loja."
COM_J2COMMERCE_GUIDEDTOUR_CREATING_PRODUCT_STEP2_TITLE="Selecione a aba J2Commerce"
COM_J2COMMERCE_GUIDEDTOUR_CREATING_PRODUCT_STEP2_DESC="Selecione a aba <strong>J2Commerce</strong> para acessar as configurações iniciais do produto."
COM_J2COMMERCE_GUIDEDTOUR_CREATING_PRODUCT_STEP3_TITLE="Utilizar o artigo como produto"
COM_J2COMMERCE_GUIDEDTOUR_CREATING_PRODUCT_STEP3_DESC="<p>Ative a opção “Usar como produto” para transformar o artigo em um produto.<br>Certifique-se de que a opção esteja definida como <strong>Sim</strong> antes de prosseguir.</p>"
COM_J2COMMERCE_GUIDEDTOUR_CREATING_PRODUCT_STEP4_TITLE="Selecione o tipo de produto"
COM_J2COMMERCE_GUIDEDTOUR_CREATING_PRODUCT_STEP4_DESC="<p>Neste tour, estamos criando um tipo de produto simples.<br>Selecione <strong>Simples</strong> no menu suspenso.</p>"
COM_J2COMMERCE_GUIDEDTOUR_CREATING_PRODUCT_STEP5_TITLE="Salve o formulário para continuar"
COM_J2COMMERCE_GUIDEDTOUR_CREATING_PRODUCT_STEP5_DESC="<p>Selecione “Salvar e continuar” para aplicar a alteração e acessar as informações do produto.</p>"
COM_J2COMMERCE_GUIDEDTOUR_CREATING_PRODUCT_STEP6_TITLE="Selecione novamente a aba J2Commerce"
COM_J2COMMERCE_GUIDEDTOUR_CREATING_PRODUCT_STEP6_DESC="Selecione o ícone da aba <strong>J2Commerce</strong> para acessar as configurações principais do produto, como visibilidade, SKU, fabricante e perfil tributário."
COM_J2COMMERCE_GUIDEDTOUR_CREATING_PRODUCT_STEP7_TITLE="Definir a visibilidade do produto"
COM_J2COMMERCE_GUIDEDTOUR_CREATING_PRODUCT_STEP7_DESC="Defina esta opção como <strong>Sim</strong> para tornar o produto visível em sua loja. Quando definida como Não, o produto existe, mas não será exibido aos clientes."
COM_J2COMMERCE_GUIDEDTOUR_CREATING_PRODUCT_STEP8_TITLE="Defina o SKU (Unidade de Manutenção de Estoque) do produto"
COM_J2COMMERCE_GUIDEDTOUR_CREATING_PRODUCT_STEP8_DESC="Insira um SKU exclusivo para o seu produto. Trata-se de um código de referência interno utilizado para o acompanhamento do estoque e o gerenciamento de pedidos."
COM_J2COMMERCE_GUIDEDTOUR_CREATING_PRODUCT_STEP9_TITLE="Definir o perfil tributário"
COM_J2COMMERCE_GUIDEDTOUR_CREATING_PRODUCT_STEP9_DESC="Selecione o perfil tributário adequado para este produto. Os perfis tributários determinam quais alíquotas de imposto se aplicam com base na localização do cliente. É possível configurar os perfis tributários em <strong>J2Commerce &rarr; Perfis Tributários</strong>."
COM_J2COMMERCE_GUIDEDTOUR_CREATING_PRODUCT_STEP10_TITLE="Selecione a aba Preços"
COM_J2COMMERCE_GUIDEDTOUR_CREATING_PRODUCT_STEP10_DESC="Selecione a aba <strong>Preços</strong> para definir o preço do produto. Você também pode configurar regras avançadas de preços para grupos de clientes e intervalos de datas."
COM_J2COMMERCE_GUIDEDTOUR_CREATING_PRODUCT_STEP11_TITLE="Definir o preço normal"
COM_J2COMMERCE_GUIDEDTOUR_CREATING_PRODUCT_STEP11_DESC="Insira o preço de venda normal do seu produto. Esse é o preço base exibido a todos os clientes antes de quaisquer descontos ou regras especiais de precificação."
COM_J2COMMERCE_GUIDEDTOUR_CREATING_PRODUCT_STEP12_TITLE="Selecione a aba Estoque"
COM_J2COMMERCE_GUIDEDTOUR_CREATING_PRODUCT_STEP12_DESC="Selecione a aba <strong>Estoque</strong> para gerenciar os níveis de estoque. É possível ativar o gerenciamento de estoque, definir quantidades e configurar o comportamento em caso de pedidos em espera."
COM_J2COMMERCE_GUIDEDTOUR_CREATING_PRODUCT_STEP13_TITLE="Gerenciar estoques"
COM_J2COMMERCE_GUIDEDTOUR_CREATING_PRODUCT_STEP13_DESC="Ative <strong>Gerenciar Estoque</strong> caso deseje que o J2Commerce acompanhe os níveis de estoque deste produto. Quando ativado, a quantidade diminuirá a cada pedido."
COM_J2COMMERCE_GUIDEDTOUR_CREATING_PRODUCT_STEP14_TITLE="Selecione a aba Frete"
COM_J2COMMERCE_GUIDEDTOUR_CREATING_PRODUCT_STEP14_DESC="Selecione a aba <strong>Frete</strong> para configurar as opções de frete para este produto, incluindo dimensões e peso."
COM_J2COMMERCE_GUIDEDTOUR_CREATING_PRODUCT_STEP15_TITLE="Ativar envio"
COM_J2COMMERCE_GUIDEDTOUR_CREATING_PRODUCT_STEP15_DESC="Defina esta opção como <strong>Sim</strong> se o produto precisar ser enviado fisicamente. Produtos digitais ou para download normalmente não requerem envio."
COM_J2COMMERCE_GUIDEDTOUR_CREATING_PRODUCT_STEP16_TITLE="Selecione “Salvar e Fechar”"
COM_J2COMMERCE_GUIDEDTOUR_CREATING_PRODUCT_STEP16_DESC="Selecione <strong>Salvar e Fechar</strong> para criar seu produto. O produto será anexado a este artigo e estará pronto para sua loja. Você poderá voltar a qualquer momento para editar os detalhes do produto."
COM_J2COMMERCE_GUIDEDTOUR_CREATING_PRODUCT_STEP17_TITLE="Parabéns!"
COM_J2COMMERCE_GUIDEDTOUR_CREATING_PRODUCT_STEP17_DESC="<p>Você criou um produto simples no J2Commerce.<br>Há mais opções para explorar, como adicionar imagens ao produto. Confira!</p>"
