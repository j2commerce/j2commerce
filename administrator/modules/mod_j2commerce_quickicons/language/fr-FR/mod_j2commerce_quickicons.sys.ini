MOD_J2COMMERCE_QUICKICONS="Icônes rapides J2Commerce"
MOD_J2COMMERCE_QUICKICONS_DESC="Affiche les icônes de gestion de la boutique J2Commerce sur le tableau de bord de l'administrateur de Joomla."
MOD_J2COMMERCE_QUICKICONS_GROUP="J2Commerce"
MOD_J2COMMERCE_QUICKICONS_CONTEXT="Contexte"
MOD_J2COMMERCE_QUICKICONS_CONTEXT_DESC="Identifie cet ensemble d’icônes. Publiez le module une fois par groupe, chaque instance disposant de son propre titre et de sa propre sélection d’icônes, et attribuez à chaque instance un contexte différent. Les plugins qui fournissent des icônes reçoivent cette valeur."
